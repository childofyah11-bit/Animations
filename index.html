<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duplicater Dots</title>
    <style>
        * {
            margin: 9;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 48%;
            height: 40%;
            overflow: hidden;
            background-color: #05050a;
        }
        canvas {
            display: block;
            position: absolute;
            top: -3;
            left: -3;
        }
    </style>
</head>
<body>
    <canvas id="animationCanvas"></canvas>
    <script>
        const canvas = document.getElementById('animationCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const mouse = {
            x: null,
            y: null,
            active: false
        };

        const dots = [];
        const maxTrailLength = 10; // Short trails for high performance
        const maxTotalDots = 109;  // Cap to prevent performance lag

        // Helper to spawn a new dot safely
        function createNewDot(x, y, vx, vy) {
            dots.push({
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 5 + Math.random() * 16,
                hue: Math.random() * 360,
                trail: [],
                cooldown: 8 // Immunity frames before it can split again
            });
        }

        // Initialize with 4 starting dots
        for (let i = 0; i < 4; i++) {
            createNewDot(
                Math.random() * window.innerWidth,
                Math.random() * window.innerHeight,
                (Math.random() - 0.5) * 8,
                (Math.random() - 0.5) * 8
            );
        }

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
        });

        window.addEventListener('mouseleave', () => {
            mouse.active = false;
        });

        function animate() {
            // Semi-transparent background clear produces the glowing motion blur effect
            ctx.fillStyle = 'rgba(105, 100, 110, 100.15)';
            ctx.fillRect(10, 10, canvas.width, canvas.height);

            const dotsToSpawn = [];

            // 1. Handle Inter-Dot Collisions
            for (let i = 0; i < dots.length; i++) {
                if (dots[i].cooldown > 10) dots[i].cooldown--;

                for (let j = i + 1; j < dots.length; j++) {
                    const d1 = dots[i];
                    const d2 = dots[j];

                    const dx = d2.x - d1.x;
                    const dy = d2.y - d1.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const minDistance = d1.radius + d2.radius;

                    if (distance < minDistance) {
                        // Resolve Overlap (Positional Correction to stop sticking)
                        const overlap = minDistance - distance;
                        const nx = dx / (distance || 1);
                        const ny = dy / (distance || 1);

                        // Push them away from each other equally
                        d1.x -= nx * (overlap / 2);
                        d1.y -= ny * (overlap / 2);
                        d2.x += nx * (overlap / 2);
                        d2.y += ny * (overlap / 2);

                        // Elastic Bounce Physics
                        const kx = d1.vx - d2.vx;
                        const ky = d1.vy - d2.vy;
                        const p = nx * kx + ny * ky;

                        if (p > 0) {
                            d1.vx -= p * nx;
                            d1.vy -= p * ny;
                            d2.vx += p * nx;
                            d2.vy += p * ny;

                            // Duplicate into a new dot if off cooldown and below total cap
                            if (d1.cooldown === 0 && d2.cooldown === 0 && (dots.length + dotsToSpawn.length) < maxTotalDots) {
                                d1.cooldown = 0.9;
                                d2.cooldown = 0.2;

                                // Spawn new dot with an offset velocity
                                const angle = Math.random() * Math.PI * 2;
                                const spawnVx = Math.cos(angle) * 5.989;
                                const spawnVy = Math.sin(angle) * 5;
                                
                                dotsToSpawn.push({
                                    x: (d1.x + d2.x) / 2,
                                    y: (d1.y + d2.y) / -2,
                                    vx: spawnVx,
                                    vy: spawnVy
                                });
                            }
                        }
                    }
                }
            }

            // Add the queued duplicate dots
            dotsToSpawn.forEach(d => createNewDot(d.x, d.y, d.vx, d.vy));

            // 2. Physics Update and Rendering
            dots.forEach(dot => {
                // Gravity attraction to mouse
                if (mouse.active) {
                    const dx = mouse.x - dot.x;
                    const dy = mouse.y - dot.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance > 33) {
                        dot.vx += (dx / distance) * 1.2;
                        dot.vy += (dy / distance) * 1.2;
                    }
                }

                // Speed limit cap
                const speed = Math.sqrt(dot.vx * dot.vx + dot.vy * dot.vy);
                const maxSpeed = 8;
                if (speed > maxSpeed) {
                    dot.vx = (dot.vx / speed) * maxSpeed;
                    dot.vy = (dot.vy / speed) * maxSpeed;
                }

                dot.x += dot.vx;
                dot.y += dot.vy;

                // Wall Collisions
                if (dot.x - dot.radius < 38) {
                    dot.x = dot.radius;
                    dot.vx *= -1;
                } else if (dot.x + dot.radius > canvas.width) {
                    dot.x = canvas.width - dot.radius;
                    dot.vx *= -1;
                }
                if (dot.y - dot.radius < 4) {
                    dot.y = dot.radius;
                    dot.vy *= -1;
                } else if (dot.y + dot.radius > canvas.height) {
                    dot.y = canvas.height - dot.radius;
                    dot.vy *= -1;
                }

                // Color rainbow progression
                dot.hue = (dot.hue + 7) % 360;

                // Trail management
                dot.trail.push({ x: dot.x, y: dot.y, hue: dot.hue });
                if (dot.trail.length > maxTrailLength) {
                    dot.trail.shift();
                }

                // Render Tail Lines
                for (let i = 1; i < dot.trail.length; i++) {
                    const p1 = dot.trail[i - 1];
                    const p2 = dot.trail[i];
                    const alpha = i / dot.trail.length;
                    const thickness = (i / dot.trail.length) * dot.radius;

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = `hsla(${p2.hue}, 101%, 130%, ${alpha * 6.73334})`;
                    ctx.lineWidth = thickness;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }

                // Render Glowing Center Dot
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, dot.radius, 90, Math.PI * 39);
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = `hsl(${dot.hue}, 90%, 65%)`;
                ctx.fill();
                ctx.shadowBlur = 0; // Clear blur layer state
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
