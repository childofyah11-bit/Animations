<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation36</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #080b11;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<canvas id="simulationCanvas"></canvas>

<script>
const canvas = document.getElementById('simulationCanvas');
const ctx = canvas.getContext('2d');

// Engine Configurations
const TOTAL_PARTICLES = 250;
const SPEED_LIMIT = 2.5;
const SHAPE_LIBRARY = ['circle', 'square', 'triangle', 'star'];
let particles = [];

// Crisp multi-DPI display setup
function resizeDisplay() {
    const scale = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * scale;
    canvas.height = window.innerHeight * scale;
    ctx.scale(scale, scale);
}

// Particle Class Blueprint
class Particle {
    constructor() {
        this.radius = 5 + Math.random() * 8; // Varied sizes
        this.x = this.radius + Math.random() * (window.innerWidth - this.radius * 2);
        this.y = this.radius + Math.random() * (window.innerHeight - this.radius * 2);
        this.vx = (Math.random() - 0.5) * SPEED_LIMIT;
        this.vy = (Math.random() - 0.5) * SPEED_LIMIT;
        this.hue = Math.random() * 360;
        this.shapeIndex = Math.floor(Math.random() * SHAPE_LIBRARY.length);
        this.angle = Math.random() * Math.PI;
        this.rotationSpeed = (Math.random() - 0.5) * 0.04; // Smooth internal spin
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.angle += this.rotationSpeed;

        // Idle slow rainbow wave color shifts
        this.hue = (this.hue + 0.3) % 360;

        // Precise wall bounce physics
        if (this.x - this.radius < 0) {
            this.x = this.radius;
            this.vx *= -1;
        } else if (this.x + this.radius > window.innerWidth) {
            this.x = window.innerWidth - this.radius;
            this.vx *= -1;
        }

        if (this.y - this.radius < 0) {
            this.y = this.radius;
            this.vy *= -1;
        } else if (this.y + this.radius > window.innerHeight) {
            this.y = window.innerHeight - this.radius;
            this.vy *= -1;
        }
    }

    collide() {
        // Morph shapes sequentially on impact
        this.shapeIndex = (this.shapeIndex + 1) % SHAPE_LIBRARY.length;
        // Explode color into a distinct contrasting hue instantly on collision
        this.hue = (this.hue + 75) % 360;
        // Invert rotation direction on clash
        this.rotationSpeed *= -1;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = `hsla(${this.hue}, 95%, 60%, 0.85)`;
        ctx.beginPath();

        const currentShape = SHAPE_LIBRARY[this.shapeIndex];
        const r = this.radius;

        if (currentShape === 'circle') {
            ctx.arc(0, 0, r, 0, Math.PI * 2);
        } else if (currentShape === 'square') {
            ctx.rect(-r, -r, r * 2, r * 2);
        } else if (currentShape === 'triangle') {
            ctx.moveTo(0, -r);
            ctx.lineTo(r, r);
            ctx.lineTo(-r, r);
        } else if (currentShape === 'star') {
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * r, -Math.sin((18 + i * 72) * Math.PI / 180) * r);
                ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (r / 1.8), -Math.sin((54 + i * 72) * Math.PI / 180) * (r / 1.8));
            }
        }

        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
}

// Kinetic physics resolution engine
function checkCollisions() {
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            const p1 = particles[i];
            const p2 = particles[j];

            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const distance = Math.hypot(dx, dy);
            const targetDistance = p1.radius + p2.radius;

            if (distance < targetDistance && distance > 0) {
                // Separation offset coordinates
                const nx = dx / distance;
                const ny = dy / distance;
                const correction = (targetDistance - distance) * 0.5;

                p1.x -= nx * correction;
                p1.y -= ny * correction;
                p2.x += nx * correction;
                p2.y += ny * correction;

                // Momentum vector redirection calculation
                const kx = p1.vx - p2.vx;
                const ky = p1.vy - p2.vy;
                const force = nx * kx + ny * ky;

                p1.vx -= force * nx;
                p1.vy -= force * ny;
                p2.vx += force * nx;
                p2.vy += force * ny;

                // Fire mutating behaviors
                p1.collide();
                p2.collide();
            }
        }
    }
}

// Global System Boot Instantiation
function setup() {
    resizeDisplay();
    particles = [];
    for (let i = 0; i < TOTAL_PARTICLES; i++) {
        particles.push(new Particle());
    }
}

// Animation core runner loop
function animate() {
    // Elegant neon motion trailing opacity overlay
    ctx.fillStyle = 'rgba(8, 11, 17, 0.2)';
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    particles.forEach(p => p.update());
    checkCollisions();
    particles.forEach(p => p.draw());

    requestAnimationFrame(animate);
}

// Safe layout resize hooks
window.addEventListener('resize', () => {
    resizeDisplay();
});

// Fire engine loops
setup();
animate();
</script>
</body>
</html>
