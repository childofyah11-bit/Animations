<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric Particle Simulation Arena</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #05070c;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<canvas id="arenaCanvas"></canvas>

<script>
const canvas = document.getElementById('arenaCanvas');
const ctx = canvas.getContext('2d');

// Simulation Configurations
const TOTAL_DOTS = 180; // Balanced count to prevent collision overhead slowdowns
const LIMIT_SPEED = 2.5;
const BOOST_SPEED = 14;
const SHAPES = ['circle', 'square', 'triangle', 'star'];
const LOCKOUT_FRAMES = 12;

let particleArray = [];
let controllableHero = null;

// Hardware Inputs Mapping Object
const arrowKeysPressed = {
    w: false, s: false, a: false, d: false,
    ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false
};

// Dynamic Background Wave Matrix
let colorWheelHue = 240;
let targetColorHue = 240;
let backgroundTimer = performance.now();

// Rescale context dynamically across varied display pixels
function autoScaleCanvasViewport() {
    const contextScaleRatio = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * contextScaleRatio;
    canvas.height = window.innerHeight * contextScaleRatio;
    ctx.scale(contextScaleRatio, contextScaleRatio);
}

// Particle Prototype Construction Layout
class ParticleNode {
    constructor(playerAssigned = false) {
        this.isPlayer = playerAssigned;
        this.radius = this.isPlayer ? 22 : 4 + Math.random() * 8;
        
        this.x = this.radius + Math.random() * (window.innerWidth - this.radius * 2);
        this.y = this.radius + Math.random() * (window.innerHeight - this.radius * 2);
        
        this.vx = this.isPlayer ? 0 : (Math.random() - 0.5) * LIMIT_SPEED;
        this.vy = this.isPlayer ? 0 : (Math.random() - 0.5) * LIMIT_SPEED;
        
        this.hue = Math.random() * 360;
        this.colorCycleVelocity = this.isPlayer ? 0 : 0.4 + Math.random() * 2.8;
        
        this.activeShapeIndex = Math.floor(Math.random() * SHAPES.length);
        this.angle = Math.random() * Math.PI;
        this.spinVelocity = this.isPlayer ? 0.015 : (Math.random() - 0.5) * 0.06;
        
        this.cooldownCounter = 0;
        this.currentSpeedCap = LIMIT_SPEED;
    }

    update() {
        if (this.isPlayer) {
            const drivePower = 0.5;
            const frictionDecay = 0.93;
            
            if (arrowKeysPressed.w || arrowKeysPressed.ArrowUp) this.vy -= drivePower;
            if (arrowKeysPressed.s || arrowKeysPressed.ArrowDown) this.vy += drivePower;
            if (arrowKeysPressed.a || arrowKeysPressed.ArrowLeft) this.vx -= drivePower;
            if (arrowKeysPressed.d || arrowKeysPressed.ArrowRight) this.vx += drivePower;
            
            this.vx *= frictionDecay;
            this.vy *= frictionDecay;
            
            const playerCurrentSpeed = Math.hypot(this.vx, this.vy);
            if (playerCurrentSpeed > 7) {
                this.vx = (this.vx / playerCurrentSpeed) * 7;
                this.vy = (this.vy / playerCurrentSpeed) * 7;
            }
        } else {
            // Ambient objects smoothly decay from explosive velocities down to baseline
            if (this.currentSpeedCap > LIMIT_SPEED) {
                this.currentSpeedCap *= 0.97;
                if (this.currentSpeedCap < LIMIT_SPEED) this.currentSpeedCap = LIMIT_SPEED;
            }
        }

        this.x += this.vx;
        this.y += this.vy;
        this.angle += this.spinVelocity;
        this.hue = (this.hue + this.colorCycleVelocity) % 360;

        if (this.cooldownCounter > 0) {
            this.cooldownCounter--;
        }

        // Window border reflections
        if (this.x - this.radius < 0) {
            this.x = this.radius;
            this.vx *= -1;
        } else if (this.x + this.radius > window.innerWidth) {
            this.x = window.innerWidth - this.radius;
            this.vx *= -1;
        }

        if (this.y - this.radius < 0) {
            this.y = this.radius;
            this.vy *= -1;
        } else if (this.y + this.radius > window.innerHeight) {
            this.y = window.innerHeight - this.radius;
            this.vy *= -1;
        }

        // Clamp individual environmental velocities dynamically
        const frameSpeed = Math.hypot(this.vx, this.vy);
        if (!this.isPlayer && frameSpeed > this.currentSpeedCap) {
            this.vx = (this.vx / frameSpeed) * this.currentSpeedCap;
            this.vy = (this.vy / frameSpeed) * this.currentSpeedCap;
        }
    }

    onClash() {
        if (this.cooldownCounter === 0) {
            if (!this.isPlayer) {
                this.activeShapeIndex = (this.activeShapeIndex + 1) % SHAPES.length;
                this.hue = (this.hue + 90) % 360;
                this.spinVelocity *= -1;
            }
            this.cooldownCounter = LOCKOUT_FRAMES;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        
        if (this.isPlayer) {
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#ffffff';
            ctx.fillStyle = '#ffffff';
        } else {
            const opacityLevel = this.cooldownCounter > 0 ? 0.5 : 0.85;
            ctx.fillStyle = `hsla(${this.hue}, 95%, 60%, ${opacityLevel})`;
        }
        
        ctx.beginPath();
        const activeShapeLayout = this.isPlayer ? 'circle' : SHAPES[this.activeShapeIndex];
        const r = this.radius;

        if (activeShapeLayout === 'circle') {
            ctx.arc(0, 0, r, 0, Math.PI * 2);
        } else if (activeShapeLayout === 'square') {
            ctx.rect(-r, -r, r * 2, r * 2);
        } else if (activeShapeLayout === 'triangle') {
            ctx.moveTo(0, -r);
            ctx.lineTo(r, r);
            ctx.lineTo(-r, r);
        } else if (activeShapeLayout === 'star') {
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * r, -Math.sin((18 + i * 72) * Math.PI / 180) * r);
                ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (r / 1.9), -Math.sin((54 + i * 72) * Math.PI / 180) * (r / 1.9));
            }
        }

        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
}

// Coordinate Distance Collision Evaluation Engine Loop
function calculateVectorCollisions() {
    for (let i = 0; i < particleArray.length; i++) {
        for (let j = i + 1; j < particleArray.length; j++) {
            const p1 = particleArray[i];
            const p2 = particleArray[j];

            const deltaDistanceX = p2.x - p1.x;
            const deltaDistanceY = p2.y - p1.y;
            const trueDistance = Math.hypot(deltaDistanceX, deltaDistanceY);
            const minimumClearance = p1.radius + p2.radius;

            if (trueDistance < minimumClearance && trueDistance > 0) {
                const vectorNormalX = deltaDistanceX / trueDistance;
                const vectorNormalY = deltaDistanceY / trueDistance;
                const offsetCorrectionScalar = (minimumClearance - trueDistance) * 0.5;

                // Move nodes apart instantly to resolve clipping artifacts
                p1.x -= vectorNormalX * offsetCorrectionScalar;
                p1.y -= vectorNormalY * offsetCorrectionScalar;
                p2.x += vectorNormalX * offsetCorrectionScalar;
                p2.y += vectorNormalY * offsetCorrectionScalar;

                // Handle kinetic redirection mapping
                const deltaVelocityX = p1.vx - p2.vx;
                const deltaVelocityY = p1.vy - p2.vy;
                let forceMagnitude = vectorNormalX * deltaVelocityX + vectorNormalY * deltaVelocityY;

                // EXPLOSIVE MODIFIER: Kick targeted objects out at super high speeds if struck by player
                if (p1.isPlayer || p2.isPlayer) {
                    const environmentalDot = p1.isPlayer ? p2 : p1;
                    environmentalDot.currentSpeedCap = BOOST_SPEED;
                    forceMagnitude *= 2.6;
                }

                p1.vx -= forceMagnitude * vectorNormalX;
                p1.vy -= forceMagnitude * vectorNormalY;
                p2.vx += forceMagnitude * vectorNormalX;
                p2.vy += forceMagnitude * vectorNormalY;

                p1.onClash();
                p2.onClash();
            }
        }
    }
}

// Global System Boot Matrix
function initiateSystemSimulation() {
    autoScaleCanvasViewport();
    particleArray = [];
    
    // Create and attach controllable target player node
    controllableHero = new ParticleNode(true);
    particleArray.push(controllableHero);

    // Build automated surrounding instances
    for (let i = 0; i < TOTAL_DOTS; i++) {
        particleArray.push(new ParticleNode(false));
    }
}

// Animation Execution Engine Core Loop
function drawFrameEngineLoop() {
    const elapsedTimestamp = performance.now();

    // Transition global target hues every 10 seconds (10000ms)
    if (elapsedTimestamp - backgroundTimer > 10000) {
        targetColorHue = Math.random() * 360;
        backgroundTimer = elapsedTimestamp;
    }

    let hueDiff = targetColorHue - colorWheelHue;
    if (hueDiff > 180) hueDiff -= 360;
    if (hueDiff < -180) hueDiff += 360;
    colorWheelHue = (colorWheelHue + hueDiff * 0.01 + 360) % 360;

    // Apply semi-opaque tint layer to clear frame canvas and blend trailing color paths smoothly
