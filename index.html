<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>59</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #030508; overflow: hidden; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

<canvas id="cyberCanvas"></canvas>

<script>
const canvas = document.getElementById('cyberCanvas');
const ctx = canvas.getContext('2d');

const DOTS_COUNT = 150;
const AMBIENT_SPEED = 1.8;
const BLAST_SPEED = 15;
const GEOMETRIES = ['circle', 'square', 'triangle', 'star'];

let nodeMatrix = [];
let cyberPlayer = null;

// Standardized directional flag mapping
const directionalInputs = { moveUp: false, moveDown: false, moveLeft: false, moveRight: false };

let globalHue = 180;
let targetHue = 180;
let timeAnchor = performance.now();

function fitViewport() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.scale(dpr, dpr);
}

class CyberNode {
    constructor(isHero = false) {
        this.hero = isHero;
        this.size = this.hero ? 24 : 3 + Math.random() * 6;
        this.x = this.size + Math.random() * (window.innerWidth - this.size * 2);
        this.y = this.size + Math.random() * (window.innerHeight - this.size * 2);
        this.vx = this.hero ? 0 : (Math.random() - 0.5) * AMBIENT_SPEED;
        this.vy = this.hero ? 0 : (Math.random() - 0.5) * AMBIENT_SPEED;
        this.hue = Math.random() * 360;
        this.colorSpeed = this.hero ? 0 : 0.5 + Math.random() * 2;
        this.shapeIdx = Math.floor(Math.random() * GEOMETRIES.length);
        this.angle = Math.random() * Math.PI;
        this.spin = this.hero ? 0.01 : (Math.random() - 0.5) * 0.05;
        this.speedCap = AMBIENT_SPEED;
    }

    update() {
        if (this.hero) {
            const accel = 0.55;
            const friction = 0.92;
            
            // Read active flags to move seamlessly across the screen layout
            if (directionalInputs.moveUp) this.vy -= accel;
            if (directionalInputs.moveDown) this.vy += accel;
            if (directionalInputs.moveLeft) this.vx -= accel;
            if (directionalInputs.moveRight) this.vx += accel;
            
            this.vx *= friction;
            this.vy *= friction;
        } else {
            if (this.speedCap > AMBIENT_SPEED) this.speedCap *= 0.98;
            
            // Smooth gravitational space warp around the player dot
            const dx = cyberPlayer.x - this.x;
            const dy = cyberPlayer.y - this.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 180 && dist > 10) {
                this.vx += (dx / dist) * 0.12;
                this.vy += (dy / dist) * 0.12;
            }
        }

        this.x += this.vx;
        this.y += this.vy;
        this.angle += this.spin;
        this.hue = (this.hue + this.colorSpeed) % 360;

        // Hard wall constraints
        if (this.x - this.size < 0) { this.x = this.size; this.vx *= -1; }
        if (this.x + this.size > window.innerWidth) { this.x = window.innerWidth - this.size; this.vx *= -1; }
        if (this.y - this.size < 0) { this.y = this.size; this.vy *= -1; }
        if (this.y + this.size > window.innerHeight) { this.y = window.innerHeight - this.size; this.vy *= -1; }

        const velocity = Math.hypot(this.vx, this.vy);
        if (!this.hero && velocity > this.speedCap) {
            this.vx = (this.vx / velocity) * this.speedCap;
            this.vy = (this.vy / velocity) * this.speedCap;
        }
    }

    mutate() {
        if (!this.hero) {
            this.shapeIdx = (this.shapeIdx + 1) % GEOMETRIES.length;
            this.hue = (this.hue + 60) % 360;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        if (this.hero) {
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ffffff';
            ctx.fillStyle = '#ffffff';
        } else {
            ctx.fillStyle = `hsla(${this.hue}, 95%, 65%, 0.85)`;
        }
        ctx.beginPath();
        const activeShape = this.hero ? 'circle' : GEOMETRIES[this.shapeIdx];
        const r = this.size;

        if (activeShape === 'circle') ctx.arc(0, 0, r, 0, Math.PI * 2);
        else if (activeShape === 'square') ctx.rect(-r, -r, r * 2, r * 2);
        else if (activeShape === 'triangle') { ctx.moveTo(0, -r); ctx.lineTo(r, r); ctx.lineTo(-r, r); }
        else if (activeShape === 'star') {
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * r, -Math.sin((18 + i * 72) * Math.PI / 180) * r);
                ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (r / 2), -Math.sin((54 + i * 72) * Math.PI / 180) * (r / 2));
            }
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
}

function processIntersections() {
    for (let i = 0; i < nodeMatrix.length; i++) {
        for (let j = i + 1; j < nodeMatrix.length; j++) {
            const n1 = nodeMatrix[i];
            const n2 = nodeMatrix[j];
            const dx = n2.x - n1.x;
            const dy = n2.y - n1.y;
            const dist = Math.hypot(dx, dy);
            const clearance = n1.size + n2.size;

            if (dist < 85 && !n1.hero && !n2.hero) {
                ctx.beginPath();
                ctx.moveTo(n1.x, n1.y);
                ctx.lineTo(n2.x, n2.y);
                ctx.strokeStyle = `hsla(${(n1.hue + n2.hue)/2}, 80%, 50%, ${1 - dist/85})`;
                ctx.lineWidth = 0.8;
                ctx.stroke();
            }

            if (dist < clearance && dist > 0) {
                const nx = dx / dist;
                const ny = dy / dist;
                const fix = (clearance - dist) * 0.5;

                n1.x -= nx * fix; n1.y -= ny * fix;
                n2.x += nx * fix; n2.y += ny * fix;

                const kx = n1.vx - n2.vx;
                const ky = n1.vy - n2.vy;
                let scalar = nx * kx + ny * ky;

                if (n1.hero || n2.hero) {
                    const struckNode = n1.hero ? n2 : n1;
                    struckNode.speedCap = BLAST_SPEED;
                    scalar *= 3.5; // High velocity explosive reflection bounce
                }

                n1.vx -= scalar * nx; n1.vy -= scalar * ny;
                n2.vx += scalar * nx; n2.vy += scalar * ny;

                n1.mutate();
                n2.mutate();
            }
        }
    }
}

function setup() {
    fitViewport();
    nodeMatrix = [];
    cyberPlayer = new CyberNode(true);
    nodeMatrix.push(cyberPlayer);
    for (let i = 0; i < DOTS_COUNT; i++) nodeMatrix.push(new CyberNode(false));
}

function engineLoop() {
    const elapsed = performance.now();
    if (elapsed - timeAnchor > 10000) { targetHue = Math.random() * 360; timeAnchor = elapsed; }
    let diff = targetHue - globalHue;
    if (diff > 180) diff -= 360;
    if (diff < -180) diff += 360;
    globalHue = (globalHue + diff * 0.01 + 360) % 360;

    ctx.fillStyle = `hsla(${globalHue}, 40%, 4%, 0.24)`;
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    nodeMatrix.forEach(n => n.update());
    processIntersections();
    nodeMatrix.forEach(n => n.draw());

    requestAnimationFrame(engineLoop);
}

// Case-insensitive physical input key tracking update loop
function parseKeyboardInputs(eventCode, isPressed) {
    if (eventCode === 'KeyW' || eventCode === 'ArrowUp') directionalInputs.moveUp = isPressed;
    if (eventCode === 'KeyS' || eventCode === 'ArrowDown') directionalInputs.moveDown = isPressed;
    if (eventCode === 'KeyA' || eventCode === 'ArrowLeft') directionalInputs.moveLeft = isPressed;
    if (eventCode === 'KeyD' || eventCode === 'ArrowRight') directionalInputs.moveRight = isPressed;
}

window.addEventListener('keydown', (e) => parseKeyboardInputs(e.code, true));
window.addEventListener('keyup', (e) => parseKeyboardInputs(e.code, false));
window.addEventListener('resize', fitViewport);

setup();
engineLoop();
</script>
</body>
</html>
