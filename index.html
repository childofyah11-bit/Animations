    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Core constraints
        const maxTotalDots = 400; // Lower capacity prevents cluttered screen spaces
        const maxSpeed = 6;
        let dots = [];
        let dotsToSpawn = [];

        // Interactive cursor tracking
        const mouse = { x: 0, y: 0, active: false };
        const obstacles = [];

        // Generate static obstacles distributed across the layout
        function generateObstacles() {
            obstacles.length = 0; 
            
            // Central main trio setup configurations
            obstacles.push({ x: canvas.width / 2, y: canvas.height / 2, radius: 50 });
            obstacles.push({ x: canvas.width / 2 - 190, y: canvas.height / 2, radius: 25 });
            obstacles.push({ x: canvas.width / 2 + 190, y: canvas.height / 2, radius: 25 });

            // Populate additional nodes inside borders
            const randomCirclesCount = 6;
            const padding = 120;
            for (let i = 0; i < randomCirclesCount; i++) {
                const radius = 15 + Math.random() * 20;
                const x = padding + Math.random() * (canvas.width - padding * 2);
                const y = padding + Math.random() * (canvas.height - padding * 2);
                
                const distToCenter = Math.hypot(x - canvas.width / 2, y - canvas.height / 2);
                if (distToCenter > 240) {
                    obstacles.push({ x, y, radius });
                } else {
                    i--; 
                }
            }
        }

        // Coordinate adjustments handler
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            generateObstacles();
        }

        // Window interaction listeners
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseenter', () => mouse.active = true);
        window.addEventListener('mouseleave', () => mouse.active = false);
        window.addEventListener('resize', resizeCanvas);

        function createNewDot(x, y, vx, vy, hue = 0) {
            dots.push({
                x: x, y: y, vx: vx, vy: vy,
                radius: 4, cooldown: 0, hue: hue,
                trail: []
            });
        }

        // Structural initialization paths
        resizeCanvas();

        // Seed initial elements
        for (let i = 0; i < 12; i++) {
            const angle = Math.random() * Math.PI * 2;
            createNewDot(
                canvas.width / 2 + (Math.random() - 0.5) * 40,
                canvas.height / 4,
                Math.cos(angle) * 3,
                Math.sin(angle) * 3,
                Math.random() * 360
            );
        }

        // Simulation Loop
        function animate() {
            // Semi-transparent overlay mask creates silky motion decay trails
            ctx.fillStyle = 'rgba(3, 5, 8, 0.18)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render static nodes with frosted crystal borders
            ctx.fillStyle = "rgba(255, 255, 255, 0.03)";
            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.lineWidth = 1.5;
            obstacles.forEach(obs => {
                ctx.beginPath();
                ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });

            dotsToSpawn = [];

            dots = dots.filter(dot => {
                // Smooth easing attraction field toward cursor vectors
                if (mouse.active) {
                    const dx = mouse.x - dot.x;
                    const dy = mouse.y - dot.y;
                    const distance = Math.hypot(dx, dy);
                    if (distance > 15 && distance < 350) {
                        dot.vx += (dx / distance) * 0.22;
                        dot.vy += (dy / distance) * 0.22;
                    }
                }

                // Drag limitations limits maximum velocities safely
                const speed = Math.hypot(dot.vx, dot.vy);
                if (speed > maxSpeed) {
                    dot.vx = (dot.vx / speed) * maxSpeed;
                    dot.vy = (dot.vy / speed) * maxSpeed;
                }

                dot.x += dot.vx;
                dot.y += dot.vy;

                // Screen boundary collisions paths
                if (dot.x - dot.radius < 0) { dot.x = dot.radius; dot.vx *= -1; }
                else if (dot.x + dot.radius > canvas.width) { dot.x = canvas.width - dot.radius; dot.vx *= -1; }
                if (dot.y - dot.radius < 0) { dot.y = dot.radius; dot.vy *= -1; }
                else if (dot.y + dot.radius > canvas.height) { dot.y = canvas.height - dot.radius; dot.vy *= -1; }

                // Obstacles collision processing 
                obstacles.forEach(obs => {
                    const dx = dot.x - obs.x;
                    const dy = dot.y - obs.y;
                    const distance = Math.hypot(dx, dy);
                    const minDist = dot.radius + obs.radius;

                    if (distance < minDist) {
                        const overlap = minDist - distance;
                        const nx = dx / (distance || 1);
                        const ny = dy / (distance || 1);
                        dot.x += nx * overlap;
                        dot.y += ny * overlap;

                        const dotProduct = dot.vx * nx + dot.vy * ny;
                        if (dotProduct < 0) {
                            dot.vx -= 2 * dotProduct * nx;
                            dot.vy -= 2 * dotProduct * ny;

                            // Duplicate nodes on high impact cycles
                            if (dot.cooldown <= 0 && (dots.length + dotsToSpawn.length) < maxTotalDots) {
                                dot.cooldown = 15; 
                                const spawnAngle = Math.random() * Math.PI * 2;
                                dotsToSpawn.push({
                                    x: dot.x + nx * 4,
                                    y: dot.y + ny * 4,
                                    vx: Math.cos(spawnAngle) * (speed || 3),
                                    vy: Math.sin(spawnAngle) * (speed || 3),
                                    radius: dot.radius,
                                    cooldown: 15,
                                    hue: (dot.hue + 140) % 360,
                                    trail: []
                                });
                            }
                        }
                    }
                });

                if (dot.cooldown > 0) dot.cooldown--;
                dot.hue = (dot.hue + 0.8) % 360;

                // Capture historical tail segments configurations
                dot.trail.push({ x: dot.x, y: dot.y });
                if (dot.trail.length > 15) dot.trail.shift();

                // Draw gorgeous luminous neon trails using ribbons instead of circles
                if (dot.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(dot.trail[0].x, dot.trail[0].y);
                    for (let i = 1; i < dot.trail.length; i++) {
                        ctx.lineTo(dot.trail[i].x, dot.trail[i].y);
                    }
                    ctx.strokeStyle = `hsla(${dot.hue}, 95%, 60%, 0.35)`;
                    ctx.lineWidth = dot.radius * 0.6;
                    ctx.stroke();
                }

                // Render main bright particle element
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${dot.hue}, 100%, 65%, 1)`;
                ctx.fill();

                return true;
            });

            dotsToSpawn.forEach(d => dots.push(d));
            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
