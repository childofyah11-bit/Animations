  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulation</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0d1117;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

<canvas id="simCanvas"></canvas>

<script>
  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');

  // Core constraints
  const maxTotalDots = 3000; 
  const maxSpeed = 0.1;
  let dots = [];
  let obstacles = [];

  // Interactive cursor tracking
  const mouse = { x: 0, y: 0, active: false };

  // Handle high-DPI/Retina screens seamlessly
  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.scale(dpr, dpr);
    
    // Re-generate layout coordinates on window change
    generateObstacles();
    generateDots();
  }

  // Generate static obstacles distributed safely across the screen layout
  function generateObstacles() {
    obstacles = [];
    const width = window.innerWidth;
    const height = window.innerHeight;

    // Central main trio setup configurations
    obstacles.push({ x: width / 2, y: height / 2, radius: 60 });
    obstacles.push({ x: width / 2 - 190, y: height / 2, radius: 30 });
    obstacles.push({ x: width / 2 + 190, y: height / 2, radius: 40 });

    // Populate additional random nodes safely inside borders
    const randomCirclesCount = 6;
    const padding = 120;

    for (let i = 0; i < randomCirclesCount; i++) {
      const radius = 15 + Math.random() * 25; 
      const x = padding + Math.random() * (width - padding * 2);
      const y = padding + Math.random() * (height - padding * 2);

      const distToCenter = Math.hypot(x - width / 2, y - height / 2);
      if (distToCenter > 220) {
        obstacles.push({ x, y, radius });
      }
    }
  }

  // Populate interactive particles/dots
  function generateDots() {
    dots = [];
    for (let i = 0; i < maxTotalDots; i++) {
      dots.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * maxSpeed,
        vy: (Math.random() - 0.5) * maxSpeed,
        radius: 2 + Math.random() * 2,
        hue: Math.random() * 360, // Track numbers natively to avoid string matching crashes
        color: '' 
      });
    }
  }

  // Interactive mouse tracking events
  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });

  window.addEventListener('mouseleave', () => {
    mouse.active = false;
  });

  // Core Physics and Rendering Loop
  function animate() {
    // Semi-transparent overlay layer leaves smooth trailing paths behind elements
    ctx.fillStyle = 'rgba(13, 17, 23, 0.12)'; 
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    // 1. Draw static obstacles with beautiful styling
    obstacles.forEach(obs => {
      ctx.beginPath();
      ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();
    });

    // 2. Update and draw interactive dots
    dots.forEach(dot => {
      // Move particles
      dot.x += dot.vx;
      dot.y += dot.vy;

      // Increment and cycle the hue value smoothly
      dot.hue = (dot.hue + 6) % 360; 
      dot.color = `hsl(${dot.hue}, 95%, 65%)`;

      // Bounce off screen walls
      if (dot.x < 0 || dot.x > window.innerWidth) dot.vx *= -1;
      if (dot.y < 0 || dot.y > window.innerHeight) dot.vy *= -1;

      // Interact with Static Obstacles (Deflection/Bounce physics)
      obstacles.forEach(obs => {
        const dist = Math.hypot(dot.x - obs.x, dot.y - obs.y);
        if (dist < obs.radius + dot.radius) {
          const angle = Math.atan2(dot.y - obs.y, dot.x - obs.x);
          dot.vx = Math.cos(angle) * maxSpeed;
          dot.vy = Math.sin(angle) * maxSpeed;
        }
      });

      // Interact with User Cursor (Gravitational attraction)
      if (mouse.active) {
        const mDist = Math.hypot(dot.x - mouse.x, dot.y - mouse.y);
        if (mDist < 150) {
          dot.vx += (mouse.x - dot.x) * 0.002;
          dot.vy += (mouse.y - dot.y) * 0.002;
        }
      }

      // Cap maximum physics speeds to prevent chaotic teleportation glitches
      const speed = Math.hypot(dot.vx, dot.vy);
      if (speed > maxSpeed) {
        dot.vx = (dot.vx / speed) * maxSpeed;
        dot.vy = (dot.vy / speed) * maxSpeed;
      }

      // Draw particle nodes
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
      ctx.fillStyle = dot.color;
      ctx.fill();
    });

    // Smoothly call next frame repaint loop
    requestAnimationFrame(animate);
  }

  // Initialize and attach lifecycle hooks
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas(); 
  animate();      
</script>

</body>
</html>
