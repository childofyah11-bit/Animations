<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulation</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0d1117;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

<canvas id="simCanvas"></canvas>

<script>
  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');

  // Core constraints - Balanced for high performance interactive collision arrays
  const maxTotalDots = 450; 
  const maxSpeed = 6;
  let dots = [];
  let obstacles = [];

  // Available interactive geometry shapes
  const shapes = ['circle', 'square', 'triangle', 'star'];

  // Interactive cursor tracking
  const mouse = { x: 0, y: 0, active: false };

  // Handle high-DPI/Retina screens seamlessly
  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.scale(dpr, dpr);
    
    // Re-generate layout coordinates on window change
    generateObstacles();
    generateDots();
  }

  // Generate static obstacles distributed safely across the screen layout
  function generateObstacles() {
    obstacles = [];
    const width = window.innerWidth;
    const height = window.innerHeight;

    // Central main trio setup configurations
    obstacles.push({ x: width / 2, y: height / 2, radius: 60 });
    obstacles.push({ x: width / 2 - 190, y: height / 2, radius: 30 });
    obstacles.push({ x: width / 2 + 190, y: height / 2, radius: 40 });

    // Populate additional random nodes safely inside borders
    const randomCirclesCount = 6;
    const padding = 120;

    for (let i = 0; i < randomCirclesCount; i++) {
      const radius = 15 + Math.random() * 25; 
      const x = padding + Math.random() * (width - padding * 2);
      const y = padding + Math.random() * (height - padding * 2);

      const distToCenter = Math.hypot(x - width / 2, y - height / 2);
      if (distToCenter > 220) {
        obstacles.push({ x, y, radius });
      }
    }
  }

  // Populate interactive particles/dots
  function generateDots() {
    dots = [];
    for (let i = 0; i < maxTotalDots; i++) {
      dots.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * maxSpeed,
        vy: (Math.random() - 0.5) * maxSpeed,
        radius: 4 + Math.random() * 4, // Slightly larger sizes so shape updates look stunning
        hue: Math.random() * 360, 
        colorSpeed: 3 + Math.random() * 10, // Randomized frequency color shift speeds
        shapeIndex: Math.floor(Math.random() * shapes.length),
        color: '' 
      });
    }
  }

  // Helper routine to swap current rendering shape type instantly on hits
  function changeShape(dot) {
    dot.shapeIndex = (dot.shapeIndex + 1) % shapes.length;
  }

  // Interactive mouse tracking events
  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });

  window.addEventListener('mouseleave', () => {
    mouse.active = false;
  });

  // Core Physics and Rendering Loop
  function animate() {
    // Semi-transparent overlay layer leaves smooth trailing paths behind elements
    ctx.fillStyle = 'rgba(13, 17, 23, 0.15)'; 
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    // 1. Draw static obstacles with beautiful styling
    obstacles.forEach(obs => {
      ctx.beginPath();
      ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();
    });

    // 2. Perform Grid-Based Particle Optimization Loop (Handles heavy ball-to-ball collisions cleanly)
    const cellSize = 40;
    const grid = {};

    dots.forEach(dot => {
      // Step physics positioning coordinates forward
      dot.x += dot.vx;
      dot.y += dot.vy;

      // Update rainbow hue variables seamlessly 
      dot.hue = (dot.hue + dot.colorSpeed) % 360;
      dot.color = `hsl(${dot.hue}, 95%, 65%)`;

      // Wall Collision verification physics logic bounds
      let wallHit = false;
      if (dot.x - dot.radius < 0) { dot.x = dot.radius; dot.vx *= -1; wallHit = true; }
      if (dot.x + dot.radius > window.innerWidth) { dot.x = window.innerWidth - dot.radius; dot.vx *= -1; wallHit = true; }
      if (dot.y - dot.radius < 0) { dot.y = dot.radius; dot.vy *= -1; wallHit = true; }
      if (dot.y + dot.radius > window.innerHeight) { dot.y = window.innerHeight - dot.radius; dot.vy *= -1; wallHit = true; }
      
      if (wallHit) changeShape(dot);

      // Map positions straight into checking buckets to save computing energy
      const cellX = Math.floor(dot.x / cellSize);
      const cellY = Math.floor(dot.y / cellSize);
      const cellKey = `${cellX},${cellY}`;
      if (!grid[cellKey]) grid[cellKey] = [];
      grid[cellKey].push(dot);
    });

    // 3. Resolve Ball-on-Ball Particle Deflection Physics
    for (let i = 0; i < dots.length; i++) {
      const d1 = dots[i];
      const cellX = Math.floor(d1.x / cellSize);
      const cellY = Math.floor(d1.y / cellSize);

      // Check self cell and immediate surrounding grid slots 
      for (let xOffset = -1; xOffset <= 1; xOffset++) {
        for (let yOffset = -1; yOffset <= 1; yOffset++) {
          const targetKey = `${cellX + xOffset},${cellY + yOffset}`;
          const neighbors = grid[targetKey];
          if (!neighbors) continue;

          for (let j = 0; j < neighbors.length; j++) {
            const d2 = neighbors[j];
            if (d1 === d2) continue; // Skip matching target comparisons

            const dx = d2.x - d1.x;
            const dy = d2.y - d1.y;
            const dist = Math.hypot(dx, dy);
            const minDist = d1.radius + d2.radius;

            // Elastic bounce resolution calculation formulas
            if (dist < minDist && dist > 0) {
              const normalX = dx / dist;
              const normalY = dy / dist;

              // Separate overlapping targets slightly to fix sticky visual bugs
              const overlap = minDist - dist;
              d1.x -= normalX * overlap * 0.5;
              d1.y -= normalY * overlap * 0.5;
              d2.x += normalX * overlap * 0.5;
              d2.y += normalY * overlap * 0.5;

              // Calculate relative impact velocities along normal vectors
              const kx = d1.vx - d2.vx;
              const ky = d1.vy - d2.vy;
              const p = 2 * (normalX * kx + normalY * ky) / 2;

              // Bounce vectors away from each other
              d1.vx -= p * normalX;
              d1.vy -= p * normalY;
              d2.vx += p * normalX;
              d2.vy += p * normalY;

              // Mutate geometric rendering values on successful collisions!
              changeShape(d1);
              changeShape(d2);
            }
          }
        }
      }

      // 4. Interact with Static Circle Obstacles
      obstacles.forEach(obs => {
        const dist = Math.hypot(d1.x - obs.x, d1.y - obs.y);
        if (dist < obs.radius + d1.radius) {
          const angle = Math.atan2(d1.y - obs.y, d1.x - obs.x);
          
          // Push outward slightly past boundaries to avoid getting locked in rings
          d1.x = obs.x + Math.cos(angle) * (obs.radius + d1.radius);
          d1.y = obs.y + Math.sin(angle) * (obs.radius + d1.radius);
          
          d1.vx = Math.cos(angle) * maxSpeed;
          d1.vy = Math.sin(angle) * maxSpeed;
          
          changeShape(d1);
        }
      });

      // 5. Interact with User Cursor Attraction Field
      if (mouse.active) {
        const mDist = Math.hypot(d1.x - mouse.x, d1.y - mouse.y);
        if (mDist < 150) {
          d1.vx += (mouse.x - d1.x) * 0.002;
          d1.vy += (mouse.y - d1.y) * 0.002;
        }
      }

      // Limit overall absolute particle movement values
      const speed = Math.hypot(d1.vx, d1.vy);
      if (speed > maxSpeed) {
        d1.vx = (d1.vx / speed) * maxSpeed;
        d1.vy = (d1.vy / speed) * maxSpeed;
      }

      // 6. Complex Vector Multi-Shape Geometry Rendering Matrix Layouts
      ctx.fillStyle = d1.color;
      ctx.strokeStyle = d1.color;
      ctx.lineWidth = 1;
      
      const currentShape = shapes[d1.shapeIndex];

      if (currentShape === 'circle') {
        ctx.beginPath();
        ctx.arc(d1.x, d1.y, d1.radius, 0, Math.PI * 2);
        ctx.fill();
      } 
      else if (currentShape === 'square') {
        const size = d1.radius * 2;
        ctx.fillRect(d1.x - d1.radius, d1.y - d1.radius, size, size);
      } 
      else if (currentShape === 'triangle') {
        ctx.beginPath();
        ctx.moveTo(d1.x, d1.y - d1.radius);
        ctx.lineTo(d1.x + d1.radius * 1.2, d1.y + d1.radius);
        ctx.lineTo(d1.x - d1.radius * 1.2, d1.y + d1.radius);
        ctx.closePath();
        ctx.fill();
      } 
      else if (currentShape === 'star') {
        ctx.beginPath();
        const spikes = 5;
        const outerRadius = d1.radius * 1.4;
        const innerRadius = d1.radius * 0.6;
        let rot = Math.PI / 2 * 3;
        let cx = d1.x, cy = d1.y;
        let step = Math.PI / spikes;

        ctx.moveTo(d1.x, d1.y - outerRadius);
        for (let k = 0; k < spikes; k++) {
          cx = d1.x + Math.cos(rot) * outerRadius;
          cy = d1.y + Math.sin(rot) * outerRadius;
          ctx.lineTo(cx, cy);
          rot += step;

          cx = d1.x + Math.cos(rot) * innerRadius;
          cy = d1.y + Math.sin(rot) * innerRadius;
          ctx.lineTo(cx, cy);
          rot += step;
        }
        ctx.closePath();
        ctx.fill();
      }
    }

    // Smoothly call next frame repaint loop
    requestAnimationFrame(animate);
  }
