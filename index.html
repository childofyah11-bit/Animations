<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Dots</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0c0f12;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Configuration and State Variables
        const maxTotalDots = 400;
        const maxSpeed = 8;
        let dots = [];
        let dotsToSpawn = [];

        // Track mouse movement and interactivity
        const mouse = { x: 0, y: 0, active: false };

        // Define static circular obstacles in the center
        const obstacles = [
            { x: window.innerWidth / 2, y: window.innerHeight / 2, radius: 25 },       // Center obstacle
            { x: window.innerWidth / 2 - 150, y: window.innerHeight / 2, radius: 15 }, // Left obstacle
            { x: window.innerWidth / 2 + 150, y: window.innerHeight / 2, radius: 15 }  // Right obstacle
        ];

        // Handle window resizing
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Re-center obstacles accurately on window scale changes
            obstacles[0].x = canvas.width / 2;
            obstacles[0].y = canvas.height / 2;
            obstacles[1].x = canvas.width / 2 - 150;
            obstacles[1].y = canvas.height / 2;
            obstacles[2].x = canvas.width / 2 + 150;
            obstacles[2].y = canvas.height / 2;
        }

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseenter', () => mouse.active = true);
        window.addEventListener('mouseleave', () => mouse.active = false);
        window.addEventListener('resize', resizeCanvas);

        // Factory function to initialize a new dot object
        function createNewDot(x, y, vx, vy, hue = 0) {
            dots.push({
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 6,
                cooldown: 0,
                hue: hue,
                trail: []
            });
        }

        // Initialize with a few starting dots
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        for (let i = 0; i < 5; i++) {
            const angle = Math.random() * Math.PI * 2;
            createNewDot(
                canvas.width / 4 + Math.random() * 100,
                canvas.height / 4 + Math.random() * 100,
                Math.cos(angle) * 4,
                Math.sin(angle) * 4,
                Math.random() * 360
            );
        }

        // Main Simulation and Rendering Loop
        function animate() {
            // Draw semi-transparent background to generate a fading trail effect
            ctx.fillStyle = 'rgba(12, 15, 18, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw the static obstacles
            ctx.fillStyle = "rgba(255, 255, 255, 0.1)"; 
            ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
            ctx.lineWidth = 2;
            obstacles.forEach(obs => {
                ctx.beginPath();
                ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });

            dotsToSpawn = [];

            // Multi-dot to multi-dot collisions
            for (let i = 0; i < dots.length; i++) {
                for (let j = i + 1; j < dots.length; j++) {
                    const d1 = dots[i];
                    const d2 = dots[j];
                    const dx = d2.x - d1.x;
                    const dy = d2.y - d1.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = d1.radius + d2.radius;

                    if (dist < minDist) {
                        const overlap = minDist - dist;
                        const nx = dx / (dist || 1);
                        const ny = dy / (dist || 1);

                        // Push away to prevent overlapping sticky states
                        d1.x -= nx * overlap * 0.5;
                        d1.y -= ny * overlap * 0.5;
                        d2.x += nx * overlap * 0.5;
                        d2.y += ny * overlap * 0.5;

                        // Vector math reflections
                        const kx = d1.vx - d2.vx;
                        const ky = d1.vy - d2.vy;
                        const p = nx * kx + ny * ky;

                        if (p > 0) {
                            d1.vx -= p * nx;
                            d1.vy -= p * ny;
                            d2.vx += p * nx;
                            d2.vy += p * ny;

                            // Duplicate into a new dot if off cooldown and below total cap
                            if (d1.cooldown === 0 && d2.cooldown === 0 && (dots.length + dotsToSpawn.length) < maxTotalDots) {
                                d1.cooldown = 0.2;
                                d2.cooldown = 0.2;

                                const angle = Math.random() * Math.PI * 2;
                                const spawnVx = Math.cos(angle) * 5;
                                const spawnVy = Math.sin(angle) * 5;

                                dotsToSpawn.push({
                                    x: (d1.x + d2.x) / 2,
                                    y: (d1.y + d2.y) / 2,
                                    vx: spawnVx,
                                    vy: spawnVy,
                                    cooldown: 0.2,
                                    radius: d1.radius,
                                    hue: (d1.hue + 60) % 360
                                });
                            }
                        }
                    }
                }
            }

            // Add the queued duplicate dots from dot collisions
            dotsToSpawn.forEach(d => createNewDot(d.x, d.y, d.vx, d.vy, d.hue));
            dotsToSpawn = [];

            // Physics Update and Rendering for each dot
            dots.forEach(dot => {
                // Gravity attraction to mouse
                if (mouse.active) {
                    const dx = mouse.x - dot.x;
                    const dy = mouse.y - dot.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance > 33) {
                        dot.vx += (dx / distance) * 0.4;
                        dot.vy += (dy / distance) * 0.4;
                    }
                }

                // Speed limit cap
                const speed = Math.sqrt(dot.vx * dot.vx + dot.vy * dot.vy);
                if (speed > maxSpeed) {
                    dot.vx = (dot.vx / speed) * maxSpeed;
                    dot.vy = (dot.vy / speed) * maxSpeed;
                }

                // --- 1. Movement updates ---
                dot.x += dot.vx;
                dot.y += dot.vy;

                // --- 2. Wall Collisions (Clean, no-jitter) ---
                if (dot.x - dot.radius < 0) {
                    dot.x = dot.radius;
                    dot.vx *= -1;
                } else if (dot.x + dot.radius > canvas.width) {
                    dot.x = canvas.width - dot.radius;
                    dot.vx *= -1;
                }

                if (dot.y - dot.radius < 0) {
                    dot.y = dot.radius;
                    dot.vy *= -1;
                } else if (dot.y + dot.radius > canvas.height) {
                    dot.y = canvas.height - dot.radius;
                    dot.vy *= -1;
                }

                // --- 3. Static Circle Obstacle Collisions & Duplication ---
                obstacles.forEach(obs => {
                    const dx = dot.x - obs.x;
                    const dy = dot.y - obs.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const minDist = dot.radius + obs.radius;

                    if (distance < minDist) {
                        const overlap = minDist - distance;
                        const nx = dx / (distance || 1);
                        const ny = dy / (distance || 1);

                        dot.x += nx * overlap;
                        dot.y += ny * overlap;

                        const dotProduct = dot.vx * nx + dot.vy * ny;

                        if (dotProduct < 0) {
                            dot.vx -= 2 * dotProduct * nx;
                            dot.vy -= 2 * dotProduct * ny;

                            // --- DUPLICATION LOGIC ON OBSTACLE BOUNCE ---
                            if (dot.cooldown === 0 && (dots.length + dotsToSpawn.length) < maxTotalDots) {
                                dot.cooldown = 0.2;

                                const angle = Math.random() * Math.PI * 2;
                                const spawnVx = Math.cos(angle) * 5;
                                const spawnVy = Math.sin(angle) * 5;

                                dotsToSpawn.push({
                                    x: dot.x,
                                    y: dot.y,
                                    vx: spawnVx,
                                    vy: spawnVy,
                                    cooldown: 0.2,
                                    radius: dot.radius,
                                    hue: (dot.hue + 180) % 360
                                });
                            }
                        }
                    }
                });

                // --- 4. Decrement Cooldown ---
                if (dot.cooldown > 0) {
