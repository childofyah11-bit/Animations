<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow    System</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #080a0f;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // State constraints
        const maxTotalDots = 400;
        const maxSpeed = 7;
        let dots = [];
        let dotsToSpawn = [];

        // Interactive cursor tracking
        const mouse = { x: 0, y: 0, active: false };

        // Central collision structural nodes
        const obstacles = [
            { x: 0, y: 0, radius: 45 }, // Center node
            { x: 0, y: 0, radius: 25 }, // Left node
            { x: 0, y: 0, radius: 25 }  // Right node
        ];

        // Dynamic coordinate configuration scaling
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Lock static geometry relative to the screen dimensions
            obstacles[0].x = canvas.width / 2;
            obstacles[0].y = canvas.height / 2;
            
            obstacles[1].x = canvas.width / 2 - 180;
            obstacles[1].y = canvas.height / 2;
            
            obstacles[2].x = canvas.width / 2 + 180;
            obstacles[2].y = canvas.height / 2;
        }

        // Window interaction event listeners
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseenter', () => mouse.active = true);
        window.addEventListener('mouseleave', () => mouse.active = false);
        window.addEventListener('resize', resizeCanvas);

        // Instantiation pipeline for creating objects
        function createNewDot(x, y, vx, vy, hue = 0) {
            dots.push({
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 4.5,
                cooldown: 0,
                hue: hue,
                trail: [] 
            });
        }

        // Explicit structural execution phase initialization 
        resizeCanvas();

        // Seed initial objects safely within viewport boundaries
        for (let i = 0; i < 8; i++) {
            const angle = Math.random() * Math.PI * 2;
            createNewDot(
                canvas.width / 2 + (Math.random() - 0.5) * 60,
                canvas.height / 5,
                Math.cos(angle) * 4,
                Math.sin(angle) * 4,
                Math.random() * 360
            );
        }

        // Main Execution Engine Lifecycle Loop
        function animate() {
            // Motion backdrop alpha overlay layer tracking
            ctx.fillStyle = 'rgba(8, 10, 15, 0.22)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render neon layout containers
            obstacles.forEach(obs => {
                ctx.fillStyle = "rgba(255, 255, 255, 0.04)"; 
                ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });

            dotsToSpawn = [];

            // Vector math simulation phase execution
            dots.forEach(dot => {
                // Gravity attraction force vectors pulling objects toward mouse location
                if (mouse.active) {
                    const dx = mouse.x - dot.x;
                    const dy = mouse.y - dot.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance > 25) {
                        dot.vx += (dx / distance) * 0.22;
                        dot.vy += (dy / distance) * 0.22;
                    }
                }

                // Normalizing clamping limitations bounds checks
                const speed = Math.sqrt(dot.vx * dot.vx + dot.vy * dot.vy);
                if (speed > maxSpeed) {
                    dot.vx = (dot.vx / speed) * maxSpeed;
                    dot.vy = (dot.vy / speed) * maxSpeed;
                }

                // Vector displacement calculation updates
                dot.x += dot.vx;
                dot.y += dot.vy;

                // Screen wall border containment check adjustments
                if (dot.x - dot.radius < 0) {
                    dot.x = dot.radius;
                    dot.vx *= -1;
                } else if (dot.x + dot.radius > canvas.width) {
                    dot.x = canvas.width - dot.radius;
                    dot.vx *= -1;
                }

                if (dot.y - dot.radius < 0) {
                    dot.y = dot.radius;
                    dot.vy *= -1;
                } else if (dot.y + dot.radius > canvas.height) {
                    dot.y = canvas.height - dot.radius;
                    dot.vy *= -1;
                }

                // Obstacle vector geometric calculation loops
                obstacles.forEach(obs => {
                    const dx = dot.x - obs.x;
                    const dy = dot.y - obs.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const minDist = dot.radius + obs.radius;

                    if (distance < minDist) {
                        // Project normalization position layout correction calculations
                        const overlap = minDist - distance;
                        const nx = dx / (distance || 1);
                        const ny = dy / (distance || 1);

                        dot.x += nx * overlap;
                        dot.y += ny * overlap;

                        const dotProduct = dot.vx * nx + dot.vy * ny;

                        if (dotProduct < 0) {
                            // Elastic momentum trajectory tracking changes
                            dot.vx -= 2 * dotProduct * nx;
                            dot.vy -= 2 * dotProduct * ny;

                            // Spawn duplication conditional processing logic pipeline triggers
                            if (dot.cooldown <= 0 && (dots.length + dotsToSpawn.length) < maxTotalDots) {
                                dot.cooldown = 10; // Frames delay

                                const spawnAngle = Math.random() * Math.PI * 2;
                                const spawnVx = Math.cos(spawnAngle) * (speed || 4);
                                const spawnVy = Math.sin(spawnAngle) * (speed || 4);

                                dotsToSpawn.push({
                                    x: dot.x + nx * 3,
                                    y: dot.y + ny * 3,
                                    vx: spawnVx,
                                    vy: spawnVy,
                                    hue: (dot.hue + 120) % 360 // Dynamic hue variance progression shifts
                                });
                            }
                        }
                    }
                });

                // Delta update state metrics tracking decrement changes
                if (dot.cooldown > 0) dot.cooldown--;

                // Colors phase transformation operations
                dot.hue = (dot.hue + 1) % 360;

                // Motion paths history sequence configuration
                dot.trail.push({ x: dot.x, y: dot.y });
                if (dot.trail.length > 20) {
                    dot.trail.shift();
                }

                // Draw linear glowing trail segments
                if (dot.trail.length > 1) {
                    ctx.shadowBlur = 0; // Disable shadow blur on lines for better performance
                    ctx.lineWidth = dot.radius * 1.5;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    for (let i = 1; i < dot.trail.length; i++) {
                        const p1 = dot.trail[i - 1];
                        const p2 = dot.trail[i];
                        const alpha = (i / dot.trail.length) * 0.4;
                        
                        ctx.strokeStyle = `hsla(${dot.hue}, 100%, 65%, ${alpha})`;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }

                // Draw Core Dot Body Elements
                ctx.fillStyle = `hsl(${dot.hue}, 100%, 75%)`;
                ctx.shadowBlur = 10; // Smooth glowing neon effect surrounding particle nodes
                ctx.shadowColor = `hsl(${dot.hue}, 100%, 60%)`;
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Clean shadow state after drawing objects
            ctx.shadowBlur = 0;

            // Merge newly cloned child components array back inside parent execution stacks
            dotsToSpawn.forEach(d => createNewDot(d.x, d.y, d.vx, d.vy, d.hue));

            requestAnimationFrame(animate);
        }

        // Start Loop Runtime Animation Environment Loops
        animate();
    </script>
</body>
</html>
