<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowParticles</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #030508;
            width: 100%;
            height: 100%;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // State constraints
        const maxTotalDots = 600;
        const maxSpeed = 8;
        const ballLifespanMs = 3 * 60 * 1000; 
        let dots = [];
        let dotsToSpawn = [];
        let shockwaves = [];

        // Interactive cursor tracking with force type
        const mouse = { x: 0, y: 0, active: false, mode: 'attract' };

        // Static obstacle container array
        const obstacles = [];

        function generateObstacles() {
            obstacles.length = 0; 
            
            // 1. Core Center Layout Configurations
            obstacles.push({ x: canvas.width / 2, y: canvas.height / 2, radius: 55, pulse: 0 });
            obstacles.push({ x: canvas.width / 2 - 220, y: canvas.height / 2, radius: 30, pulse: 0 });
            obstacles.push({ x: canvas.width / 2 + 220, y: canvas.height / 2, radius: 30, pulse: 0 });

            // 2. Randomized Structural Nodes
            const randomCirclesCount = 8;
            const padding = 120;
            for (let i = 0; i < randomCirclesCount; i++) {
                const radius = 20 + Math.random() * 25;
                const x = padding + Math.random() * (canvas.width - padding * 2);
                const y = padding + Math.random() * (canvas.height - padding * 2);
                const distToCenter = Math.hypot(x - canvas.width / 2, y - canvas.height / 2);
                
                if (distToCenter > 280) {
                    obstacles.push({ x, y, radius, pulse: 0 });
                } else {
                    i--; 
                }
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            generateObstacles();
        }

        // Window interaction event listeners
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseenter', () => mouse.active = true);
        window.addEventListener('mouseleave', () => mouse.active = false);
        window.addEventListener('mousedown', () => mouse.mode = 'repel');
        window.addEventListener('mouseup', () => mouse.mode = 'attract');
        window.addEventListener('resize', resizeCanvas);

        function createNewDot(x, y, vx, vy, hue = 0) {
            const massScale = 0.6 + Math.random() * 0.8; // Varied particle weights
            dots.push({
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 3.5 * massScale,
                mass: massScale,
                cooldown: 0,
                hue: hue,
                spawnTime: Date.now(),
                trail: []
            });
        }

        function createShockwave(x, y, color) {
            shockwaves.push({ x, y, radius: 10, maxRadius: 70, alpha: 1, color });
        }

        // Initialize Layout Environment Space
        resizeCanvas();

        // Seed initial elements
        for (let i = 0; i < 15; i++) {
            const angle = Math.random() * Math.PI * 2;
            createNewDot(
                canvas.width / 2 + (Math.random() - 0.5) * 100,
                canvas.height / 4,
                Math.cos(angle) * 3,
                Math.sin(angle) * 3,
                Math.random() * 360
            );
        }

        // Main Simulation Engine Lifecycle Loop
        function animate() {
            const currentTime = Date.now();

            // Motion backdrop alpha overlay layer tracking (Faint trail decay)
            ctx.fillStyle = 'rgba(3, 5, 8, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render shockwaves
            shockwaves = shockwaves.filter(wave => {
                ctx.beginPath();
                ctx.arc(wave.x, wave.y, wave.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `hsla(${wave.color}, 90%, 65%, ${wave.alpha})`;
                ctx.lineWidth = 3;
                ctx.stroke();
                
                wave.radius += 4;
                wave.alpha -= 0.025;
                return wave.alpha > 0;
            });

            // Render static obstacle configurations
            obstacles.forEach(obs => {
                if (obs.pulse > 0) obs.pulse *= 0.92; // Decay flash animation smoothly

                ctx.save();
                ctx.beginPath();
                ctx.arc(obs.x, obs.y, obs.radius + obs.pulse * 8, 0, Math.PI * 2);
                
                // Outer Neon Glow Styling Base
                ctx.shadowBlur = 15 + obs.pulse * 20;
                ctx.shadowColor = obs.pulse > 0 ? `hsla(180, 100%, 70%, 0.6)` : "rgba(255, 255, 255, 0.05)";
                ctx.fillStyle = `rgba(20, 30, 45, ${0.15 + obs.pulse * 0.3})`;
                ctx.strokeStyle = obs.pulse > 0 ? `hsla(180, 100%, 75%, 0.8)` : "rgba(255, 255, 255, 0.2)";
                ctx.lineWidth = obs.pulse > 0 ? 3 : 1.5;
                
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            });

            dotsToSpawn = [];

            // Operational vector calculation loop sequences
            dots = dots.filter(dot => {
                if (currentTime - dot.spawnTime > ballLifespanMs) return false;

                // Interactive Cursor Vector Physics (Attract or Repel switches on Click)
                if (mouse.active) {
                    const dx = mouse.x - dot.x;
                    const dy = mouse.y - dot.y;
                    const distance = Math.hypot(dx, dy);
                    
                    if (distance > 10 && distance < 400) {
                        const force = (400 - distance) / 400 * 0.35 / dot.mass;
                        if (mouse.mode === 'attract') {
                            dot.vx += (dx / distance) * force;
                            dot.vy += (dy / distance) * force;
                        } else { // Repel Force
                            dot.vx -= (dx / distance) * force * 1.5;
                            dot.vy -= (dy / distance) * force * 1.5;
                        }
                    }
                }

                // Global drag to slow extreme velocities gently
                dot.vx *= 0.995;
                dot.vy *= 0.995;

                // Speed limitations bounds checking
                const speed = Math.hypot(dot.vx, dot.vy);
                if (speed > maxSpeed) {
                    dot.vx = (dot.vx / speed) * maxSpeed;
                    dot.vy = (dot.vy / speed) * maxSpeed;
                }

                // Displacement vectors application
                dot.x += dot.vx;
                dot.y += dot.vy;

                // Canvas boundaries reflections
                if (dot.x - dot.radius < 0) { dot.x = dot.radius; dot.vx *= -1; }
                else if (dot.x + dot.radius > canvas.width) { dot.x = canvas.width - dot.radius; dot.vx *= -1; }
                if (dot.y - dot.radius < 0) { dot.y = dot.radius; dot.vy *= -1; }
                else if (dot.y + dot.radius > canvas.height) { dot.y = canvas.height - dot.radius; dot.vy *= -1; }

                // Rigid circular object node geometry physics loop cycles
                obstacles.forEach(obs => {
                    const dx = dot.x - obs.x;
                    const dy = dot.y - obs.y;
                    const distance = Math.hypot(dx, dy);
                    const minDist = dot.radius + obs.radius;

                    if (distance < minDist) {
                        const overlap = minDist - distance;
                        const nx = dx / (distance || 1);
                        const ny = dy / (distance || 1);

                        dot.x += nx * overlap;
                        dot.y += ny * overlap;

                        const dotProduct = dot.vx * nx + dot.vy * ny;
                        if (dotProduct < 0) {
                            dot.vx -= 2 * dotProduct * nx;
                            dot.vy -= 2 * dotProduct * ny;

                            // Dynamic Visual Bounce Feedback Impacts
                            obs.pulse = 1.0; 

                            // Object duplication replication flow pipelines
                            if (dot.cooldown <= 0 && (dots.length + dotsToSpawn.length) < maxTotalDots) {
                                dot.cooldown = 15;
                                const spawnAngle = Math.random() * Math.PI * 2;
                                const nextSpeed = Math.max(speed, 3);
                                
                                const nextHue = (dot.hue + 140) % 360;
                                createShockwave(dot.x, dot.y, dot.hue);

                                dotsToSpawn.push({
                                    x: dot.x + nx * 4,
                                    y: dot.y + ny * 4,
                                    vx: Math.cos(spawnAngle) * nextSpeed,
                                    vy: Math.sin(spawnAngle) * nextSpeed,
                                    radius: dot.radius,
                                    mass: dot.mass,
                                    cooldown: 15,
                                    hue: nextHue,
