<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric Shape Shifter Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0f19;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<canvas id="simCanvas"></canvas>

<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

// Simulation Configurations
const TOTAL_PARTICLES = 300;
const MAX_SPEED = 3;
const SHAPES = ['circle', 'square', 'triangle', 'star'];
let particles = [];

// Handle crisp resolution on retina displays
function setupCanvasDimensions() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.scale(dpr, dpr);
}

// Particle Generation Blueprint
class Particle {
    constructor() {
        this.radius = 4 + Math.random() * 8; // Varying Sizes
        this.x = this.radius + Math.random() * (window.innerWidth - this.radius * 2);
        this.y = this.radius + Math.random() * (window.innerHeight - this.radius * 2);
        
        // Random velocities
        this.vx = (Math.random() - 0.5) * MAX_SPEED;
        this.vy = (Math.random() - 0.5) * MAX_SPEED;
        
        this.hue = Math.random() * 360; // Random starting color
        this.shapeIndex = Math.floor(Math.random() * SHAPES.length);
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;

        // Continuous slow color shift over time
        this.hue = (this.hue + 0.5) % 360;

        // Wall Bouncing Logic
        if (this.x - this.radius < 0) {
            this.x = this.radius;
            this.vx *= -1;
        } else if (this.x + this.radius > window.innerWidth) {
            this.x = window.innerWidth - this.radius;
            this.vx *= -1;
        }

        if (this.y - this.radius < 0) {
            this.y = this.radius;
            this.vy *= -1;
        } else if (this.y + this.radius > window.innerHeight) {
            this.y = window.innerHeight - this.radius;
            this.vy *= -1;
        }
    }

    onCollide() {
        // Change shapes on collision
        this.shapeIndex = (this.shapeIndex + 1) % SHAPES.length;
        // Shift color hue dramatically on impact
        this.hue = (this.hue + 60) % 360;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = `hsla(${this.hue}, 95%, 60%, 0.85)`;
        ctx.beginPath();

        const currentShape = SHAPES[this.shapeIndex];
        const r = this.radius;

        if (currentShape === 'circle') {
            ctx.arc(0, 0, r, 0, Math.PI * 2);
        } else if (currentShape === 'square') {
            ctx.rect(-r, -r, r * 2, r * 2);
        } else if (currentShape === 'triangle') {
            ctx.moveTo(0, -r);
            ctx.lineTo(r, r);
            ctx.lineTo(-r, r);
        } else if (currentShape === 'star') {
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * r, -Math.sin((18 + i * 72) * Math.PI / 180) * r);
                ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (r / 2), -Math.sin((54 + i * 72) * Math.PI / 180) * (r / 2));
            }
        }

        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
}

// Check collisions using spatial partitioning optimization
function resolveCollisions() {
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            const p1 = particles[i];
            const p2 = particles[j];

            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const dist = Math.hypot(dx, dy);
            const minDist = p1.radius + p2.radius;

            if (dist < minDist && dist > 0) {
                // Normal overlap correction vector
                const nx = dx / dist;
                const ny = dy / dist;
                const overlap = (minDist - dist) * 0.5;

                // Push apart instantly to fix overlap sticking
                p1.x -= nx * overlap;
                p1.y -= ny * overlap;
                p2.x += nx * overlap;
                p2.y += ny * overlap;

                // Simple elastic collision vector reflection swap
                const kx = p1.vx - p2.vx;
                const ky = p1.vy - p2.vy;
                const p = nx * kx + ny * ky;

                p1.vx -= p * nx;
                p1.vy -= p * ny;
                p2.vx += p * nx;
                p2.vy += p * ny;

                // Trigger shape mutations and color shifts
                p1.onCollide();
                p2.onCollide();
            }
        }
    }
}

// Initialization Entry Point
function init() {
    setupCanvasDimensions();
    particles = [];
    for (let i = 0; i < TOTAL_PARTICLES; i++) {
        particles.push(new Particle());
    }
}

// Continuous Core Animation Loop
function loop() {
    // Faint overlay transparent fill creates fluid particle motion trailing
    ctx.fillStyle = 'rgba(11, 15, 25, 0.2)';
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    // Dynamic Updates
    particles.forEach(p => p.update());
    resolveCollisions();
    particles.forEach(p => p.draw());

    requestAnimationFrame(loop);
}

// Hook Window Resize Events Safely
window.addEventListener('resize', () => {
    setupCanvasDimensions();
});

// Run Simulation Engine
init();
loop();
</script>
</body>
</html>
