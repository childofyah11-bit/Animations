<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Rainbow Trail Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #ff007f, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Rainbow Bouncer</h1>
        <p>Move mouse to attract | Click to blast speed</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas sizing
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Core physics configurations
        const pointer = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            vx: 5,
            vy: 4,
            radius: 12,
            hue: 0
        };

        const mouse = {
            x: null,
            y: null,
            active: false
        };

        const trail = [];
        const maxTrailLength = 60; // Length of the multicolor tail

        // Track real mouse interaction
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
        });

        window.addEventListener('mouseleave', () => {
            mouse.active = false;
        });

        // Click to unleash sudden impulse speed
        window.addEventListener('mousedown', () => {
            pointer.vx *= 1.8;
            pointer.vy *= 1.8;
        });

        // Main Simulation Loop
        function animate() {
            // Semi-transparent background clear produces the glowing motion blur effect
            ctx.fillStyle = 'rgba(5, 5, 10, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Apply Mouse Gravity (if mouse is inside viewport)
            if (mouse.active) {
                const dx = mouse.x - pointer.x;
                const dy = mouse.y - pointer.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance > 5) {
                    // Pull pointer toward mouse smoothly
                    pointer.vx += (dx / distance) * 0.4;
                    pointer.vy += (dy / distance) * 0.4;
                }
            }

            // 2. Speed limit/drag to keep simulation controlled
            const speed = Math.sqrt(pointer.vx * pointer.vx + pointer.vy * pointer.vy);
            const maxSpeed = 15;
            if (speed > maxSpeed) {
                pointer.vx = (pointer.vx / speed) * maxSpeed;
                pointer.vy = (pointer.vy / speed) * maxSpeed;
            }

            // 3. Update position
            pointer.x += pointer.vx;
            pointer.y += pointer.vy;

            // 4. Boundary Collision Detection (Bouncing off edges)
            if (pointer.x - pointer.radius < 0) {
                pointer.x = pointer.radius;
                pointer.vx *= -1;
            } else if (pointer.x + pointer.radius > canvas.width) {
                pointer.x = canvas.width - pointer.radius;
                pointer.vx *= -1;
            }

            if (pointer.y - pointer.radius < 0) {
                pointer.y = pointer.radius;
                pointer.vy *= -1;
            } else if (pointer.y + pointer.radius > canvas.height) {
                pointer.y = canvas.height - pointer.radius;
                pointer.vy *= -1;
            }

            // 5. Shift color hue across the spectrum
            pointer.hue = (pointer.hue + 2) % 360;

            // 6. Record trail history
            trail.push({ x: pointer.x, y: pointer.y, hue: pointer.hue });
            if (trail.length > maxTrailLength) {
                trail.shift();
            }

            // 7. Render Multi-Color Trail Line
            for (let i = 1; i < trail.length; i++) {
                const p1 = trail[i - 1];
                const p2 = trail[i];
                
                // Calculate opacity fade for older trail elements
                const alpha = i / trail.length;
                const thickness = (i / trail.length) * pointer.radius;

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `hsla(${p2.hue}, 100%, 60%, ${alpha})`;
                ctx.lineWidth = thickness;
                ctx.lineCap = 'round';
                ctx.stroke();
            }

            // 8. Render Primary Ball Pointer
            ctx.beginPath();
            ctx.arc(pointer.x, pointer.y, pointer.radius, 0, Math.PI * 2);
            ctx.fillStyle = `hsl(${pointer.hue}, 100%, 70%)`;
            ctx.shadowBlur = 15;
            ctx.shadowColor = `hsl(${pointer.hue}, 100%, 70%)`;
            ctx.fill();
            ctx.shadowBlur = 0; // Reset shadow for efficiency

            requestAnimationFrame(animate);
        }

        // Initialize execution
        animate();
    </script>
</body>
</html>
