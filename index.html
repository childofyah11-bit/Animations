            const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

// State constraints
const maxTotalDots = 600;
const maxSpeed = 7;
const ballLifespanMs = 3 * 60 * 1000; // 3 minutes in milliseconds
let dots = [];
let dotsToSpawn = [];

// Interactive cursor tracking
const mouse = { x: 0, y: 0, active: false };

// Static obstacle container array
const obstacles = [];

// Generate static obstacles distributed across the viewport layout
function generateObstacles() {
    obstacles.length = 0; // Clear existing array elements cleanly
    
    // 1. Guaranteed Center Trio Layout Configuration
    obstacles.push({ x: canvas.width / 2, y: canvas.height / 2, radius: 45 });
    obstacles.push({ x: canvas.width / 2 - 180, y: canvas.height / 2, radius: 25 });
    obstacles.push({ x: canvas.width / 2 + 180, y: canvas.height / 2, radius: 25 });

    // 2. Populate 10 additional randomized structural nodes safely inside borders
    const randomCirclesCount = 10;
    const padding = 100;
    for (let i = 0; i < randomCirclesCount; i++) {
        const radius = 15 + Math.random() * 25; 
        const x = padding + Math.random() * (canvas.width - padding * 2);
        const y = padding + Math.random() * (canvas.height - padding * 2);
        
        // Keep circles separated from the main center nodes to avoid overlapping bugs
        const distToCenter = Math.hypot(x - canvas.width / 2, y - canvas.height / 2);
        if (distToCenter > 250) {
            obstacles.push({ x, y, radius });
        } else {
            i--; // Retry step loops to fulfill circle counts
        }
    }
}

// Dynamic coordinate configuration scaling
function resizeCanvas() {
    const oldWidth = canvas.width;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    if (oldWidth === 0 || Math.abs(canvas.width - oldWidth) > 100) {
        generateObstacles();
    } else {
        if (obstacles.length >= 3) {
            obstacles[0].x = canvas.width / 2; obstacles[0].y = canvas.height / 2;
            obstacles[1].x = canvas.width / 2 - 180; obstacles[1].y = canvas.height / 2;
            obstacles[2].x = canvas.width / 2 + 180; obstacles[2].y = canvas.height / 2;
        }
    }
}

// Window interaction event listeners
window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});
window.addEventListener('mouseenter', () => mouse.active = true);
window.addEventListener('mouseleave', () => mouse.active = false);
window.addEventListener('resize', resizeCanvas);

// Instantiation constructor for adding tracking nodes
function createNewDot(x, y, vx, vy, hue = 0) {
    dots.push({
        x: x,
        y: y,
        vx: vx,
        vy: vy,
        radius: 4.5,
        cooldown: 0,
        hue: hue,
        spawnTime: Date.now(), 
        trail: []
    });
}

// Explicit structural execution phase initialization
resizeCanvas();

// Seed initial moving elements safely within space environments
for (let i = 0; i < 10; i++) {
    const angle = Math.random() * Math.PI * 2;
    createNewDot(
        canvas.width / 2 + (Math.random() - 0.5) * 60,
        canvas.height / 5,
        Math.cos(angle) * 4,
        Math.sin(angle) * 4,
        Math.random() * 360
    );
}

// Main Simulation Engine Lifecycle Loop
function animate() {
    const currentTime = Date.now();

    // Motion backdrop alpha overlay layer tracking
    ctx.fillStyle = 'rgba(6, 8, 12, 0.25)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Render static obstacle elements smoothly
    ctx.fillStyle = "rgba(255, 255, 255, 0.04)";
    ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
    ctx.lineWidth = 2;
    obstacles.forEach(obs => {
        ctx.beginPath();
        ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    });

    dotsToSpawn = [];

    // Filters out particles whose lifespans have exceeded 3 minutes
    dots = dots.filter(dot => {
        if (currentTime - dot.spawnTime > ballLifespanMs) {
            return false; 
        }

        // Gravity attraction vectors drawing objects toward active interactive inputs
        if (mouse.active) {
            const dx = mouse.x - dot.x;
            const dy = mouse.y - dot.y;
            const distance = Math.hypot(dx, dy);
            if (distance > 25) {
                dot.vx += (dx / distance) * 0.24;
                dot.vy += (dy / distance) * 0.24;
            }
        }

        // Velocity boundaries limiting vector values bounds checks
        const speed = Math.hypot(dot.vx, dot.vy);
        if (speed > maxSpeed) {
            dot.vx = (dot.vx / speed) * maxSpeed;
            dot.vy = (dot.vy / speed) * maxSpeed;
        }

        // Vector displacement application sequences
        dot.x += dot.vx;
        dot.y += dot.vy;

        // Screen wall edge bounce alignment processing operations
        if (dot.x - dot.radius < 0) {
            dot.x = dot.radius; dot.vx *= -1;
        } else if (dot.x + dot.radius > canvas.width) {
            dot.x = canvas.width - dot.radius; dot.vx *= -1;
        }
        if (dot.y - dot.radius < 0) {
            dot.y = dot.radius; dot.vy *= -1;
        } else if (dot.y + dot.radius > canvas.height) {
            dot.y = canvas.height - dot.radius; dot.vy *= -1;
        }

        // Rigid circular object node geometry physics loop cycles
        obstacles.forEach(obs => {
            const dx = dot.x - obs.x;
            const dy = dot.y - obs.y;
            const distance = Math.hypot(dx, dy);
            const minDist = dot.radius + obs.radius;

            if (distance < minDist) {
                const overlap = minDist - distance;
                const nx = dx / (distance || 1);
                const ny = dy / (distance || 1);
                dot.x += nx * overlap;
                dot.y += ny * overlap;

                const dotProduct = dot.vx * nx + dot.vy * ny;
                if (dotProduct < 0) {
                    dot.vx -= 2 * dotProduct * nx;
                    dot.vy -= 2 * dotProduct * ny;

                    if (dot.cooldown <= 0 && (dots.length + dotsToSpawn.length) < maxTotalDots) {
                        dot.cooldown = 12; 
                        const spawnAngle = Math.random() * Math.PI * 2;
                        const spawnVx = Math.cos(spawnAngle) * (speed || 4);
                        const spawnVy = Math.sin(spawnAngle) * (speed || 4);
                        dotsToSpawn.push({
                            x: dot.x + nx * 3,
                            y: dot.y + ny * 3,
                            vx: spawnVx,
                            vy: spawnVy,
                            radius: dot.radius,
                            cooldown: 12,
                            hue: (dot.hue + 130) % 360,
                            spawnTime: Date.now(),
                            trail: []
                        });
                    }
                }
            }
        });

        if (dot.cooldown > 0) dot.cooldown--;
        dot.hue = (dot.hue + 1) % 360;

        // Render trail history circles
        dot.trail.push({ x: dot.x, y: dot.y });
        if (dot.trail.length > 22) dot.trail.shift();

        for (let i = 0; i < dot.trail.length; i++) {
            const ratio = i / dot.trail.length;
            ctx.beginPath();
            ctx.arc(dot.trail[i].x, dot.trail[i].y, dot.radius * ratio, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${dot.hue}, 100%, 50%, ${ratio * 0.3})`;
            ctx.fill();
        }

        // Render main active head point element
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${dot.hue}, 100%, 60%, 1)`;
        ctx.fill();

        return true;
    });

    dotsToSpawn.forEach(d => dots.push(d));
    requestAnimationFrame(animate);
}

// Fire the loop process structure
requestAnimationFrame(animate);
