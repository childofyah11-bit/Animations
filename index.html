<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Dots Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0c0f12;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Configuration and State Limits
        const maxTotalDots = 300;
        const maxSpeed = 7;
        let dots = [];
        let dotsToSpawn = [];

        // Interactive mouse tracking
        const mouse = { x: 0, y: 0, active: false };

        // Static Circular Obstacles
        const obstacles = [
            { x: 0, y: 0, radius: 30 }, // Center
            { x: 0, y: 0, radius: 18 }, // Left
            { x: 0, y: 0, radius: 18 }  // Right
        ];

        // Layout handling for screen adjustments
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Recalculate obstacle placement coordinates based on active viewport scale
            obstacles[0].x = canvas.width / 2;
            obstacles[0].y = canvas.height / 2;
            
            obstacles[1].x = canvas.width / 2 - 160;
            obstacles[1].y = canvas.height / 2;
            
            obstacles[2].x = canvas.width / 2 + 160;
            obstacles[2].y = canvas.height / 2;
        }

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseenter', () => mouse.active = true);
        window.addEventListener('mouseleave', () => mouse.active = false);
        window.addEventListener('resize', resizeCanvas);

        // Factory constructor for dots
        function createNewDot(x, y, vx, vy, hue = 0) {
            dots.push({
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 5,
                cooldown: 0,
                hue: hue,
                trail: [] // Stores history positions for visual rendering paths
            });
        }

        // Initialize viewport constraints and instantiate baseline dot array
        resizeCanvas();
        for (let i = 0; i < 6; i++) {
            const angle = Math.random() * Math.PI * 2;
            createNewDot(
                canvas.width / 2 + (Math.random() - 0.5) * 100,
                canvas.height / 4,
                Math.cos(angle) * 4,
                Math.sin(angle) * 4,
                Math.random() * 360
            );
        }

        // Engine Loop
        function animate() {
            // Context refresh frame canvas wipe
            ctx.fillStyle = 'rgba(12, 15, 18, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Static Circular Obstacles
            ctx.fillStyle = "rgba(255, 255, 255, 0.08)"; 
            ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
            ctx.lineWidth = 2.5;
            obstacles.forEach(obs => {
                ctx.beginPath();
                ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });

            dotsToSpawn = [];

            // Main processing cycle
            dots.forEach(dot => {
                // Interactivity force multiplier pulling targets toward input cursor
                if (mouse.active) {
                    const dx = mouse.x - dot.x;
                    const dy = mouse.y - dot.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance > 20) {
                        dot.vx += (dx / distance) * 0.25;
                        dot.vy += (dy / distance) * 0.25;
                    }
                }

                // Vector validation speed safety clamping bounds limits
                const speed = Math.sqrt(dot.vx * dot.vx + dot.vy * dot.vy);
                if (speed > maxSpeed) {
                    dot.vx = (dot.vx / speed) * maxSpeed;
                    dot.vy = (dot.vy / speed) * maxSpeed;
                }

                // Position integration update sequence
                dot.x += dot.vx;
                dot.y += dot.vy;

                // Screen Wall Border Bounce Computations
                if (dot.x - dot.radius < 0) {
                    dot.x = dot.radius;
                    dot.vx *= -1;
                } else if (dot.x + dot.radius > canvas.width) {
                    dot.x = canvas.width - dot.radius;
                    dot.vx *= -1;
                }

                if (dot.y - dot.radius < 0) {
                    dot.y = dot.radius;
                    dot.vy *= -1;
                } else if (dot.y + dot.radius > canvas.height) {
                    dot.y = canvas.height - dot.radius;
                    dot.vy *= -1;
                }

                // Fixed Obstacle Physics Collision Calculations
                obstacles.forEach(obs => {
                    const dx = dot.x - obs.x;
                    const dy = dot.y - obs.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const minDist = dot.radius + obs.radius;

                    if (distance < minDist) {
                        // Position projection displacement vector normalization correction mechanics
                        const overlap = minDist - distance;
                        const nx = dx / (distance || 1);
                        const ny = dy / (distance || 1);

                        dot.x += nx * overlap;
                        dot.y += ny * overlap;

                        const dotProduct = dot.vx * nx + dot.vy * ny;

                        if (dotProduct < 0) {
                            // Elastic kinetic bounce angle momentum reflection matrix
                            dot.vx -= 2 * dotProduct * nx;
                            dot.vy -= 2 * dotProduct * ny;

                            // Object clone duplication logic trigger processing pipeline
                            if (dot.cooldown <= 0 && (dots.length + dotsToSpawn.length) < maxTotalDots) {
                                dot.cooldown = 12; // Standard frame tick protection delay

                                const angle = Math.random() * Math.PI * 2;
                                const spawnVx = Math.cos(angle) * (speed || 4);
                                const spawnVy = Math.sin(angle) * (speed || 4);

                                dotsToSpawn.push({
                                    x: dot.x + nx * 2,
                                    y: dot.y + ny * 2,
                                    vx: spawnVx,
                                    vy: spawnVy,
                                    hue: (dot.hue + 140) % 360 // Shifts color palette variation variables
                                });
                            }
                        }
                    }
                });

                // Cool down timeline decrement tracking transitions
                if (dot.cooldown > 0) dot.cooldown--;

                // Colors trajectory shift adjustments
                dot.hue = (dot.hue + 1) % 360;

                // Trace trail sequence position update management structures
                dot.trail.push({ x: dot.x, y: dot.y });
                if (dot.trail.length > 15) {
                    dot.trail.shift();
                }

                // Draw Smooth Color Trails
                for (let i = 0; i < dot.trail.length; i++) {
                    const pos = dot.trail[i];
                    const alpha = (i / dot.trail.length) * 0.35;
                    const trailRadius = dot.radius * (i / dot.trail.length) * 0.9;
                    ctx.fillStyle = `hsla(${dot.hue}, 100%, 65%, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, trailRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Draw Core Dot Body Elements
                ctx.fillStyle = `hsl(${dot.hue}, 100%, 70%)`;
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Append queued child clone structures into parent lifecycle elements array
            dotsToSpawn.forEach(d => createNewDot(d.x, d.y, d.vx, d.vy, d.hue));

            requestAnimationFrame(animate);
        }

        // Run Engine Loops
        animate();
    </script>
</body>
</html>
