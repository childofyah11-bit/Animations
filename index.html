<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>62</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #020406; overflow: hidden; width: 100vw; height: 100vh; 
            display: flex; justify-content: center; align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* Glassmorphic Dashboard Panel Overlay */
        #dashboardMenu {
            position: absolute; top: 20px; left: 20px;
            background: rgba(8, 12, 20, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 18px; width: 260px; color: #fff;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5); user-select: none;
        }
        .menuHeader { font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
        .inputRow { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .inputRow label { font-size: 11px; color: #94a3b8; display: flex; justify-content: space-between; }
        .inputRow label span { font-weight: 700; color: #38bdf8; }
        .sliderInput { -webkit-appearance: none; width: 100%; height: 4px; border-radius: 99px; background: rgba(255,255,255,0.15); outline: none; }
        .sliderInput::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; cursor: pointer; box-shadow: 0 0 8px #38bdf8; }
    </style>
</head>
<body>

<canvas id="arenaCanvas"></canvas>

<div id="dashboardMenu">
    <div class="menuHeader">Nebula Control Panel</div>
    <div class="inputRow">
        <label>Player Shield Size: <span id="lblSize">25px</span></label>
        <input type="range" id="slSize" class="sliderInput" min="15" max="60" value="25">
    </div>
    <div class="inputRow">
        <label>Repulsion Blast Force: <span id="lblBlast">3.5x</span></label>
        <input type="range" id="slBlast" class="sliderInput" min="1" max="8" step="0.5" value="3.5">
    </div>
    <div class="inputRow">
        <label>Laser Vector Range: <span id="lblLaser">80px</span></label>
        <input type="range" id="slLaser" class="sliderInput" min="0" max="200" step="5" value="80">
    </div>
</div>

<script>
const canvas = document.getElementById('arenaCanvas');
const ctx = canvas.getContext('2d');

const TOTAL_ELEMENTS = 140;
const BASE_SPEED = 1.6;
const SHAPE_MODES = ['circle', 'square', 'triangle', 'star'];

let elementArray = [];
let jgPlayer = null;

// Dynamic control bindings
const movementKeys = { Up: false, Down: false, Left: false, Right: false };
const liveSettings = { size: 25, blastForce: 3.5, laserRange: 80 };

let activeHue = 240;
let destinationHue = 240;
let backgroundTimer = performance.now();

function updateDimensions() {
    const dprRatio = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dprRatio;
    canvas.height = window.innerHeight * dprRatio;
    ctx.scale(dprRatio, dprRatio);
}

class ArenaNode {
    constructor(isHeroInstance = false) {
        this.isPlayer = isHeroInstance;
        this.radius = this.isPlayer ? liveSettings.size : 3 + Math.random() * 6;
        
        this.x = this.radius + Math.random() * (window.innerWidth - this.radius * 2);
        this.y = this.radius + Math.random() * (window.innerHeight - this.radius * 2);
        
        this.vx = this.isPlayer ? 0 : (Math.random() - 0.5) * BASE_SPEED;
        this.vy = this.isPlayer ? 0 : (Math.random() - 0.5) * BASE_SPEED;
        
        this.hue = Math.random() * 360;
        this.colorSpeed = this.isPlayer ? 0 : 0.4 + Math.random() * 2;
        this.shapeIndex = Math.floor(Math.random() * SHAPE_MODES.length);
        this.rotationAngle = Math.random() * Math.PI;
        this.spinSpeed = this.isPlayer ? 0.01 : (Math.random() - 0.5) * 0.05;
        this.speedCap = BASE_SPEED;
    }

    update() {
        if (this.isPlayer) {
            this.radius = liveSettings.size; // Update shield size instantly from UI
            
            const accelerationForce = 0.65;
            const globalDecay = 0.91;
            
            if (movementKeys.Up) this.vy -= accelerationForce;
            if (movementKeys.Down) this.vy += accelerationForce;
            if (movementKeys.Left) this.vx -= accelerationForce;
            if (movementKeys.Right) this.vx += accelerationForce;
            
            this.vx *= globalDecay;
            this.vy *= globalDecay;
        } else {
            // Cool down from explosive launches over time
            if (this.speedCap > BASE_SPEED) {
                this.speedCap *= 0.98;
                if (this.speedCap < BASE_SPEED) this.speedCap = BASE_SPEED;
            }
        }

        this.x += this.vx;
        this.y += this.vy;
        this.rotationAngle += this.spinSpeed;
        this.hue = (this.hue + this.colorSpeed) % 360;

        // Secure bounds collisions
        if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -1; }
        if (this.x + this.radius > window.innerWidth) { this.x = window.innerWidth - this.radius; this.vx *= -1; }
        if (this.y - this.radius < 0) { this.y = this.radius; this.vy *= -1; }
        if (this.y + this.radius > window.innerHeight) { this.y = window.innerHeight - this.radius; this.vy *= -1; }

        // Dynamic speed clamping
        const currentSpeed = Math.hypot(this.vx, this.vy);
        if (!this.isPlayer && currentSpeed > this.speedCap) {
            this.vx = (this.vx / currentSpeed) * this.speedCap;
            this.vy = (this.vy / currentSpeed) * this.speedCap;
        }
    }

    onImpact() {
        if (!this.isPlayer) {
            this.shapeIndex = (this.shapeIndex + 1) % SHAPE_MODES.length;
            this.hue = (this.hue + 75) % 360;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotationAngle);
        
        if (this.isPlayer) {
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#38bdf8';
            ctx.fillStyle = '#ffffff';
        } else {
            ctx.fillStyle = `hsla(${this.hue}, 95%, 65%, 0.85)`;
        }
        
        ctx.beginPath();
        const activeShapeLayout = this.isPlayer ? 'circle' : SHAPE_MODES[this.shapeIndex];
        const r = this.radius;

        if (activeShapeLayout === 'circle') {
            ctx.arc(0, 0, r, 0, Math.PI * 2);
        } else if (activeShapeLayout === 'square') {
            ctx.rect(-r, -r, r * 2, r * 2);
        } else if (activeShapeLayout === 'triangle') {
            ctx.moveTo(0, -r);
            ctx.lineTo(r, r);
            ctx.lineTo(-r, r);
        } else if (activeShapeLayout === 'star') {
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * r, -Math.sin((18 + i * 72) * Math.PI / 180) * r);
                ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (r / 2), -Math.sin((54 + i * 72) * Math.PI / 180) * (r / 2));
            }
        }
        
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
}

function processIntersections() {
    for (let i = 0; i < elementArray.length; i++) {
        for (let j = i + 1; j < elementArray.length; j++) {
            const n1 = elementArray[i];
            const n2 = elementArray[j];
            
            const dx = n2.x - n1.x;
            const dy = n2.y - n1.y;
            const distance = Math.hypot(dx, dy);
            const clearanceLimit = n1.radius + n2.radius;

            // Render laser beam grid networks
            if (distance < liveSettings.laserRange && !n1.isPlayer && !n2.isPlayer) {
                ctx.beginPath();
                ctx.moveTo(n1.x, n1.y);
                ctx.lineTo(n2.x, n2.y);
                ctx.strokeStyle = `hsla(${(n1.hue + n2.hue)/2}, 85%, 55%, ${1 - distance / liveSettings.laserRange})`;
                ctx.lineWidth = 0.8;
                ctx.stroke();
            }

            if (distance < clearanceLimit && distance > 0) {
                const nx = dx / distance;
                const ny = dy / distance;
                const overlappingCorrection = (clearanceLimit - distance) * 0.5;

                // PLOW THROUGH PHYSICS: Player never loses momentum; targets are thrown away
                if (n1.isPlayer) {
                    n2.x += nx * overlappingCorrection * 2;
                    n2.y += ny * overlappingCorrection * 2;
                } else if (n2.isPlayer) {
                    n1.x -= nx * overlappingCorrection * 2;
                    n1.y -= ny * overlappingCorrection * 2;
                } else {
                    n1.x -= nx * overlappingCorrection;
                    n1.y -= ny * overlappingCorrection;
                    n2.x += nx * overlappingCorrection;
                    n2.y += ny * overlappingCorrection;
                }

                const kx = n1.vx - n2.vx;
                const ky = n1.vy - n2.vy;
                let forceMagnitude = nx * kx + ny * ky;

                if (n1.isPlayer || n2.isPlayer) {
                    const struckTarget = n1.isPlayer ? n2 : n1;
                    struckTarget.speedCap = 16; 
                    forceMagnitude *= (liveSettings.blastForce * 1.3); // Dynamic blast boost multiplier

                    if (n1.isPlayer) {
                        n2.vx += forceMagnitude * nx;
                        n2.vy += forceMagnitude * ny;
                    } else {
                        n1.vx -= forceMagnitude * nx;
                        n1.vy -= forceMagnitude * ny;
                    }
                } else {
                    n1.vx -= forceMagnitude * nx;
                    n1.vy -= forceMagnitude * ny;
