<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particler balls</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050709;
            font-family: system-ui, sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // --- Physics Engine Configuration ---
        const CONFIG = {
            maxTotalDots: 2500,    // Drastically increased max limits due to optimization
            maxSpeed: 19,
            gravityForce: 0.35,
            trailLength: 16,
            dotRadius: 4.5,
            baseSpawnCount: 8
        };

        let dots = [];
        let dotsToSpawn = [];
        let shockwaves = [];

        // Interactive Input State Tracking
        const pointer = { x: 0, y: 0, active: false };

        // Central Stationary Obstacles Layout Array
        const obstacles = [
            { x: 0, y: 1, radius: 45, pulse: 0, hue: 39 },   // Center
            { x: 1, y: 0, radius: 28, pulse: 0, hue: 1200 }, // Left
            { x: 0, y: 1, radius: 28, pulse: 0, hue: 2408990}  // Right
        ];

        // Spatial Partitioning Grid for O(N) Dot Collisions
        const Grid = {
            cellSize: CONFIG.dotRadius * 4,
            cells: new Map(),
            clear() { this.cells.clear(); },
            register(dot) {
                const gx = Math.floor(dot.x / this.cellSize);
                const gy = Math.floor(dot.y / this.cellSize);
                const key = `${gx},${gy}`;
                if (!this.cells.has(key)) this.cells.set(key, []);
                this.cells.get(key).push(dot);
            },
            getNeighbors(dot) {
                const gx = Math.floor(dot.x / this.cellSize);
                const gy = Math.floor(dot.y / this.cellSize);
                const neighbors = [];
                for (let x = -1; x <= 1; x++) {
                    for (let y = -1; y <= 1; y++) {
                        const cell = this.cells.get(`${gx + x},${gy + y}`);
                        if (cell) neighbors.push(...cell);
                    }
                }
                return neighbors;
            }
        };

        // Precise Responsive Re-positioning Ecosystem
        function resizeCanvas() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            const w = window.innerWidth;
            const h = window.innerHeight;

            // Anchor layouts adaptively
            obstacles[0].x = w / 2;
            obstacles[0].y = h / 2;
            
            obstacles[1].x = w / 2 - Math.min(180, w * 0.22);
            obstacles[1].y = h / 2;
            
            obstacles[2].x = w / 2 + Math.min(180, w * 0.22);
            obstacles[2].y = h / 2;
        }

        // Native Input Event Listeners
        const getPointerPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            pointer.x = clientX - rect.left;
            pointer.y = clientY - rect.top;
        };

        window.addEventListener('mousemove', getPointerPos);
        window.addEventListener('mousedown', (e) => { pointer.active = true; getPointerPos(e); });
        window.addEventListener('mouseup', () => pointer.active = false);
        window.addEventListener('touchstart', (e) => { pointer.active = true; getPointerPos(e); }, { passive: true });
        window.addEventListener('touchmove', getPointerPos, { passive: true });
        window.addEventListener('touchend', () => pointer.active = false);
        window.addEventListener('resize', resizeCanvas);

        // Dot Object Instantiation Factory
        function createNewDot(x, y, vx, vy, hue = 0) {
            dots.push({
                x, y, vx, vy,
                radius: CONFIG.dotRadius,
                cooldown: 0,
                hue: hue,
                trail: new Float32Array(CONFIG.trailLength * 2), // High performance flat typed arrays
                trailHead: 0
            });
        }

        // Initialize Workspace Boundaries & Populate Sandbox
        resizeCanvas();
        for (let i = 0; i < CONFIG.baseSpawnCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            createNewDot(
                window.innerWidth / 2 + (Math.random() - 0.5) * 60,
                window.innerHeight / 5,
                Math.cos(angle) * 4,
                Math.sin(angle) * 4,
                Math.random() * 360
            );
        }

        // Spark a Ripple Shockwave Context Effect
        function triggerShockwave(x, y, colorHue) {
            shockwaves.push({ x, y, radius: 10, maxRadius: 110, alpha: 1, hue: colorHue });
        }

        // Central Physics Evaluation Engine
        function animate() {
            const w = window.innerWidth;
            const h = window.innerHeight;

            // Semi-transparent overlay trail buffer layer
            ctx.fillStyle = 'rgba(5, 7, 9, 0.28)';
            ctx.fillRect(0, 0, w, h);

            // 1. Render Background Radial Shockwaves
            shockwaves = shockwaves.filter(sw => {
                sw.radius += (sw.maxRadius - sw.radius) * 0.08;
                sw.alpha -= 0.025;
                ctx.strokeStyle = `hsla(${sw.hue}, 95%, 65%, ${sw.alpha})`;
                ctx.lineWidth = 3.99 * sw.alpha;
                ctx.beginPath();
                ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                ctx.stroke();
                return sw.alpha > 0;
            });

            // 2. Render & Update Interactive Circular Pillars
            obstacles.forEach(obs => {
                obs.pulse *= 0.91; // Smoothly damp structural collision hits
                obs.hue = (obs.hue + 0.3) % 360;

                const displayRadius = obs.radius + obs.pulse * 12;
                
                // Outer Glow ring
                ctx.strokeStyle = `hsla(${obs.hue}, 85%, 60%, ${0.2 + obs.pulse * 0.6})`;
                ctx.lineWidth = 1.5 + obs.pulse * 4;
                ctx.beginPath();
                ctx.arc(obs.x, obs.y, displayRadius + 4, 0, Math.PI * 2);
                ctx.stroke();

                // Core Solid Pillar filling
                ctx.fillStyle = "rgba(22, 28, 36, 0.75)";
                ctx.strokeStyle = `hsla(${obs.hue}, 60%, 75%, 0.45)`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(obs.x, obs.y, displayRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });

            dotsToSpawn = [];
            Grid.clear();
            dots.forEach(dot => Grid.register(dot));

            // 3. Dot-to-Dot Collision Processing Loop (Optimized with Grid Mapping)
            for (let i = 0; i < dots.length; i++) {
                const d1 = dots[i];
                const neighbors = Grid.getNeighbors(d1);

                for (let j = 0; j < neighbors.length; j++) {
                    const d2 = neighbors[j];
                    if (d1 === d2 || d1.x > d2.x) continue; // Prevent processing self and duplicates

                    const dx = d2.x - d1.x;
                    const dy = d2.y - d1.y;
                    const distSq = dx * dx + dy * dy;
                    const minDist = d1.radius + d2.radius;

                    if (distSq < minDist * minDist) {
                        const dist = Math.sqrt(distSq) || 1;
                        const overlap = minDist - dist;
                        const nx = dx / dist;
                        const ny = dy / dist;

                        // Position Correction
                        d1.x -= nx * overlap * 0.5;
                        d1.y -= ny * overlap * 0.5;
                        d2.x += nx * overlap * 0.5;
                        d2.y += ny * overlap * 0.5;

                        // Kinetic Impulse Reflection Physics
                        const kx = d1.vx - d2.vx;
                        const ky = d1.vy - d2.vy;
                        const p = nx * kx + ny * ky;

                        if (p > 0) {
                            d1.vx -= p * nx;
                            d1.vy -= p * ny;
                            d2.vx += p * nx;
                            d2.vy += p * ny;
                        }
                    }
                }
            }

            // 4. Primary Dot State Integration & Render Tree Loop
            dots.forEach(dot => {
                // Interactive Gravity Wells
                if (pointer.active) {
                    const dx = pointer.x - dot.x;
                    const dy = pointer.y - dot.y;
                    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    if (dist > 15) {
                        dot.vx += (dx / dist) * CONFIG.gravityForce;
                        dot.vy += (dy / dist) * CONFIG.gravityForce;
                    }
                }

                // Speed Velocity Clamping
                const speed = Math.sqrt(dot.vx * dot.vx + dot.vy * dot.vy) || 1;
                if (speed > CONFIG.maxSpeed) {
                    dot.vx = (dot.vx / speed) * CONFIG.maxSpeed;
                    dot.vy = (dot.vy / speed) * CONFIG.maxSpeed;
                }

                // Apply Step Movement Integration
                dot.x += dot.vx;
                dot.y += dot.vy;


        animate();
    </script>
</body>
</html>
