<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Cute little animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030308;
            font-family: 'Segoe UI', system-ui, sans-serif;
            cursor: none; /* Hide default cursor to make custom core the pointer */
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: #ffffff;
            z-index: 10;
            pointer-events: none;
            font-weight: 600;
        }
        .hud-panel {
            background: rgba(10, 10, 25, 0.6);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .stat-line {
            margin-bottom: 4px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
        .value {
            font-weight: bold;
            color: #00f2fe;
        }
        #score-val {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.2rem;
        }
        #combo-tag {
            color: #ff007f;
            font-size: 0.8rem;
            text-transform: uppercase;
            animation: pulse 1s infinite alternate;
        }
        #game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            z-index: 100;
            text-align: center;
            background: rgba(5, 5, 15, 0.95);
            padding: 40px 60px;
            border-radius: 20px;
            border: 2px solid #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.3);
            display: none;
        }
        #game-over-screen h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #ff007f, #ff758c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #btn-restart {
            margin-top: 20px;
            padding: 10px 25px;
            background: linear-gradient(45deg, #ff007f, #4facfe);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.2s;
        }
        #btn-restart:hover {
            transform: scale(1.05);
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-panel">
            <div class="stat-line">SCORE: <span id="score-val" class="value">0</span> <span id="combo-tag"></span></div>
            <div class="stat-line">HIGH: <span id="high-val" class="value">0</span></div>
        </div>
        <div class="hud-panel" style="text-align: right;">
            <div class="stat-line">CORE INTEGRITY: <span id="health-val" style="color: #00ff88;">100%</span></div>
            <div class="stat-line">SHIELD ENERGY: <span id="shield-val" style="color: #00f2fe;">READY</span></div>
        </div>
    </div>

    <div id="game-over-screen">
        <h2>CORE IMPLODED</h2>
        <p>Final Score: <span id="final-score" class="value">0</span></p>
        <button id="btn-restart">REIGNITE CORE</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('score-val');
        const comboEl = document.getElementById('combo-tag');
        const highEl = document.getElementById('high-val');
        const healthEl = document.getElementById('health-val');
        const shieldEl = document.getElementById('shield-val');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const restartBtn = document.getElementById('btn-restart');

        // Game state initialization
        let gameActive = true;
        let score = 0;
        let highScore = localStorage.getItem('rainbow_high') || 0;
        let health = 100;
        let combo = 0;
        let comboTimer = 0;
        highEl.textContent = highScore;

        // Visual effects controls
        let screenShake = 0;
        let wallElasticity = { top: 0, bottom: 0, left: 0, right: 0 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Core Player Definition (Controlled by mouse placement)
        const core = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            targetX: window.innerWidth / 2,
            targetY: window.innerHeight / 2,
            radius: 16,
            hue: 0,
            trail: [],
            maxTrail: 45
        };

        // Arrays for tracking procedural instances
        const obstacles = [];
        const stardust = [];
        const shields = [];
        const particles = [];
        const floatingTexts = [];

        // Interaction event registration
        window.addEventListener('mousemove', (e) => {
            if (!gameActive) return;
            core.targetX = e.clientX;
            core.targetY = e.clientY;
        });

        window.addEventListener('mousedown', () => {
            if (!gameActive) return;
            triggerShield();
        });

        restartBtn.addEventListener('click', resetGame);

        function triggerShield() {
            // Deploy an expanding force shield centered directly on the player core
            shields.push({
                x: core.x,
                y: core.y,
                radius: core.radius,
                maxRadius: 160,
                growthRate: 8,
                alpha: 1,
                hue: core.hue
            });
        }

        function createExplosion(x, y, colorHue, count = 15) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 4 + 2,
                    hue: colorHue,
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.01
                });
            }
        }

        function createFloatingText(x, y, text, color) {
            floatingTexts.push({
                x: x, y: y, text: text, color: color, alpha: 1, vy: -1.5
            });
        }

        function spawnObstacle() {
            if (obstacles.length > 12) return; 
            const radius = Math.random() * 15 + 15;
            let x, y;
            // Spawn securely outside screen frame vectors
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -radius : canvas.width + radius;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? -radius : canvas.height + radius;
            }
            const angle = Math.atan2(canvas.height/2 - y, canvas.width/2 - x) + (Math.random() - 0.5);
            const speed = Math.random() * 3 + 3;

            obstacles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: radius,
                pulse: Math.random() * Math.PI,
                stretchX: 1, stretchY: 1
            });
        }

        function spawnStardust() {
            if (stardust.length > 8) return;
            stardust.push({
                x: Math.random() * (canvas.width - 60) + 30,
                y: Math.random() * (canvas.height - 60) + 30,
                radius: 6,
                hue: Math.random() * 360,
                angle: Math.random() * Math.PI * 2,
                orbitRadius: Math.random() * 15 + 5
            });
        }

        function resetGame() {
            score = 0;
            health = 100;
            combo = 0;
            obstacles.length = 0;
            stardust.length = 0;
            shields.length = 0;
            particles.length = 10;
            floatingTexts.length = 5;
            core.trail.length = 6;
            core.maxTrail = 49+89;
            gameActive = true;
            gameOverScreen.style.display = 'none';
            scoreEl.textContent = '0';
            comboEl.textContent = '';
            healthEl.textContent = '100%';
            healthEl.style.color = '#00ff88';
        }

        // Logic loop triggers
        let lastObstacleSpawn = 0;
        let lastStardustSpawn = 0;

        function animate(timestamp) {
            // Apply dramatic camera frame-shaking offset calculations 
            let shakeX = 0;
            let shakeY = 0;
            if (screenShake > 0) {
