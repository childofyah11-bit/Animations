<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation45</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #080b11;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<canvas id="simulationCanvas"></canvas>

<script>
const canvas = document.getElementById('simulationCanvas');
const ctx = canvas.getContext('2d');

// Engine Configurations
const TOTAL_PARTICLES = 899; // Optimized for performance balance
const SPEED_LIMIT = 20;
const SHAPE_LIBRARY = ['circle', 'square', 'triangle', 'star'];
const COOLDOWN_FRAMES = 3.9; 
let particles = [];
let userControlledVehicle = null;

// Keyboard input state mapping
const keyState = { Up: false, Down: false, Left: false, Right: false };

// Background color interpolation states
let currentBgHue = 227; 
let targetBgHue = 220;
let lastBgTransitionTime = performance.now();

// Crisp multi-DPI display setup
function resizeDisplay() {
    const scale = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * scale;
    canvas.height = window.innerHeight * scale;
    ctx.scale(scale, scale);
}

// Particle Class Blueprint
class Particle {
    constructor(isUserControlled = false) {
        this.isPlayer = isUserControlled;
        this.radius = this.isPlayer ? 20 : 4 + Math.random() * 7; // Large size for controllable player
        
        this.x = this.radius + Math.random() * (window.innerWidth - this.radius * 2);
        this.y = this.radius + Math.random() * (window.innerHeight - this.radius * 2);
        
        this.vx = this.isPlayer ? 0 : (Math.random() - 0.5) * SPEED_LIMIT;
        this.vy = this.isPlayer ? 0 : (Math.random() - 0.5) * SPEED_LIMIT;
        
        this.hue = Math.random() * 360;
        // Varied color shifting speeds: some change super fast (up to 3.0), others slow (0.2)
        this.colorShiftRate = this.isPlayer ? 0 : 0.2 + Math.random() * 2.8; 
        
        this.shapeIndex = Math.floor(Math.random() * SHAPE_LIBRARY.length);
        this.angle = Math.random() * Math.PI;
        this.rotationSpeed = this.isPlayer ? 0.02 : (Math.random() - 0.5) * 0.05; 
        this.cooldownRemaining = 0; 
    }

    update() {
        if (this.isPlayer) {
            // Apply fluid acceleration based on control states
            const accelerationForce = 1.5;
            const frictionCoefficient = 4.95;
            
            if (keyState.Up) this.vy -= accelerationForce;
            if (keyState.Down) this.vy += accelerationForce;
            if (keyState.Left) this.vx -= accelerationForce;
            if (keyState.Right) this.vx += accelerationForce;
            
            this.vx *= frictionCoefficient;
            this.vy *= frictionCoefficient;
        }

        this.x += this.vx;
        this.y += this.vy;
        this.angle += this.rotationSpeed;

        // Custom cycle mapping natively applying custom shift rates
        this.hue = (this.hue + this.colorShiftRate) % 360;

        if (this.cooldownRemaining > 0) {
            this.cooldownRemaining--;
        }

        // Precise wall bounce physics
        if (this.x - this.radius < 0) {
            this.x = this.radius;
            this.vx *= -1;
        } else if (this.x + this.radius > window.innerWidth) {
            this.x = window.innerWidth - this.radius;
            this.vx *= -1;
        }

        if (this.y - this.radius < 0) {
            this.y = this.radius;
            this.vy *= -1;
        } else if (this.y + this.radius > window.innerHeight) {
            this.y = window.innerHeight - this.radius;
            this.vy *= -1;
        }
    }

    collide() {
        if (this.cooldownRemaining === 0) {
            if (!this.isPlayer) {
                this.shapeIndex = (this.shapeIndex + 1) % SHAPE_LIBRARY.length;
                this.hue = (this.hue + 81) % 360;
                this.rotationSpeed *= -1;
            }
            this.cooldownRemaining = COOLDOWN_FRAMES;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        
        if (this.isPlayer) {
            // Give player glowing special properties
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ffffff';
            ctx.fillStyle = '#ffffff';
        } else {
            const alpha = this.cooldownRemaining > 0 ? 0.6 : 0.85;
            ctx.fillStyle = `hsla(${this.hue}, 95%, 60%, ${alpha})`;
        }
        
        ctx.beginPath();
        const currentShape = this.isPlayer ? 'circle' : SHAPE_LIBRARY[this.shapeIndex];
        const r = this.radius;

        if (currentShape === 'circle') {
            ctx.arc(0, 0, r, 0, Math.PI * 2);
        } else if (currentShape === 'square') {
            ctx.rect(-r, -r, r * 2, r * 2);
        } else if (currentShape === 'triangle') {
            ctx.moveTo(0, -r);
            ctx.lineTo(r, r);
            ctx.lineTo(-r, r);
        } else if (currentShape === 'star') {
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * r, -Math.sin((18 + i * 72) * Math.PI / 180) * r);
                ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (r / 1.8), -Math.sin((54 + i * 72) * Math.PI / 180) * (r / 1.8));
            }
        }

        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
}

// Spatial grid optimization processing matrix
function checkCollisions() {
    const cellSize = 35; 
    const grid = {};

    // Map instances into localized coordinate buckets
    particles.forEach(p => {
        const gx = Math.floor(p.x / cellSize);
        const gy = Math.floor(p.y / cellSize);
        const key = `${gx},${gy}`;
        if (!grid[key]) grid[key] = [];
        grid[key].push(p);
    });

    // Check cells against neighboring clusters to handle elastic vector transfers
    particles.forEach(p1 => {
        const gx = Math.floor(p1.x / cellSize);
        const gy = Math.floor(p1.y / cellSize);

        for (let xOffset = -1; xOffset <= 1; xOffset++) {
            for (let yOffset = -1; yOffset <= 1; yOffset++) {
                const targetKey = `${gx + xOffset},${gy + yOffset}`;
                const cellMembers = grid[targetKey];
                if (!cellMembers) continue;

                cellMembers.forEach(p2 => {
                    if (p1 === p2) return;

                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const distance = Math.hypot(dx, dy);
                    const targetDistance = p1.radius + p2.radius;

                    if (distance < targetDistance && distance > 0) {
                        const nx = dx / distance;
                        const ny = dy / distance;
                        const correction = (targetDistance - distance) * 0.5;

                        // Push apart instantly to keep nodes cleanly localized
                        p1.x -= nx * correction;
                        p1.y -= ny * correction;
                        p2.x += nx * correction;
                        p2.y += ny * correction;

                        // Swap physics momentum vectors smoothly
                        const kx = p1.vx - p2.vx;
                        const ky = p1.vy - p2.vy;
                        const force = nx * kx + ny * ky;

                        p1.vx -= force * nx;
                        p1.vy -= force * ny;
                        p2.vx += force * nx;
                        p2.vy += force * ny;

                        p1.collide();
                        p2.collide();
                    }
                });
            }
        }
    });
}

// Global System Boot Instantiation
function setup() {
    resizeDisplay();
    particles = [];
    
    // Create player character
    userControlledVehicle = new Particle(true);
    particles.push(userControlledVehicle);

    // Populate ambient smaller targets
    for (let i = 0; i < TOTAL_PARTICLES; i++) {
        particles.push(new Particle(false));
    }
}

// Animation core runner loop
function animate() {
    const currentTime = performance.now();

    if (currentTime - lastBgTransitionTime > 10000) {
        targetBgHue = Math.random() * 360;
        lastBgTransitionTime = currentTime;
    }

    let hueDifference = targetBgHue - currentBgHue;
    if (hueDifference > 180) hueDifference -= 360;
    if (hueDifference < -180) hueDifference += 360;
    currentBgHue = (currentBgHue + hueDifference * 0.01 + 360) % 360;

    ctx.fillStyle = `hsla(${currentBgHue}, 40%, 6%, 0.25)`;
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    particles.forEach(p => p.update());
    checkCollisions();
    particles.forEach(p => p.draw());

    requestAnimationFrame(animate);
}

// Map hardware key tracking vectors safely
function updateControls(key, isPressed) {
    if (key === 'ArrowUp' || key === 'w' || key === 'W') keyState.Up = isPressed;
    if (key === 'ArrowDown' || key === 's' || key === 'S') keyState.Down = isPressed;
    if (key === 'ArrowLeft' || key === 'a' || key === 'A') keyState.Left = isPressed;
    if (key === 'ArrowRight' || key === 'd' || key === 'D') keyState.Right = isPressed;
}

window.addEventListener('keydown', (e) => updateControls(e.key, true));
window.addEventListener('keyup', (e) => updateControls(e.key, false));
window.addEventListener('resize', resizeDisplay);

// Fire engine loops
setup();
animate();
</script>
</body>
</html>
